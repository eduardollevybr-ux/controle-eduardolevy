<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle | Eduardo Levy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#08090b;
  --bg-soft:#0d0f12;
  --card:#131519;
  --card-2:#181b20;
  --border:rgba(255,255,255,.055);
  --border-soft:rgba(255,255,255,.03);
  --text:#f2f3f5;
  --text-dim:#9297a1;
  --text-faint:#5a5e66;
  --blue:#3b82f6;
  --blue-dim:rgba(59,130,246,.14);
  --pos:#a78bfa;
  --pos-text:#c4b5fd;
  --pos-bg:rgba(167,139,250,.13);
  --pos-bg-strong:#1e1a35;
  --pos-border:rgba(167,139,250,.3);
  --red:#f8564f;
  --red-text:#f87171;
  --red-bg:rgba(248,86,79,.12);
  --red-bg-strong:#2a1414;
  --yellow:#eab308;
  --yellow-bg:rgba(234,179,8,.12);
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;color-scheme:dark;}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #101318 0%, var(--bg) 55%) fixed;
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.num,.stat-value,.money{ font-family:'Manrope',system-ui,sans-serif; }

#app{max-width:1600px;margin:0 auto;padding:0 14px 48px;}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:center;position:relative;
  padding:18px 4px 16px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 78%, transparent);
  backdrop-filter:blur(6px);
}
nav.tabs{
  display:flex;gap:4px;background:var(--card);border:1px solid var(--border);padding:5px;border-radius:999px;
  max-width:100%;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;cursor:grab;
  -webkit-user-select:none;user-select:none;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs.dragging{cursor:grabbing;}
nav.tabs button{
  appearance:none;border:none;background:transparent;color:var(--text-dim);
  font-family:'Inter';font-weight:600;font-size:14px;
  padding:12px 34px;border-radius:999px;cursor:pointer;
  transition:background .18s ease, color .18s ease;
  white-space:nowrap;
}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px -4px rgba(59,130,246,.55);}

.topbar-right{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:10px;
}
.save-pill{
  font-size:11px;color:var(--text-faint);display:flex;align-items:center;gap:6px;
  opacity:0;transition:opacity .25s ease;
}
.save-pill.show{opacity:1;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos);}

/* ---------- generic ---------- */
.view{display:none;}
.view.active{display:block;animation:fadeUp .42s cubic-bezier(.16,1,.3,1);}
@keyframes fadeUp{
  0%{opacity:0;transform:translateY(16px) scale(.985);filter:blur(2px);}
  55%{opacity:1;filter:blur(0);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
}
.section-title{
  font-family:'Manrope';font-weight:800;font-size:12.5px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--text-dim);margin:0 0 12px;
}
.hint{font-size:12px;color:var(--text-faint);line-height:1.5;}

/* ---------- dashboard layout ---------- */
.dash-grid{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:stretch;margin-top:6px;}
.dash-stats{display:flex;flex-direction:column;gap:8px;}
.stat-block{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:13px 16px;transition:background .18s ease, transform .15s ease;
  animation:fadeUp .4s ease both;
}
.stat-block:hover{background:var(--card-2);}
.stat-label{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-faint);font-weight:600;}
.stat-value{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.3px;}
.stat-value.pos{color:var(--pos-text);}
.stat-value.neg{color:var(--red-text);}
.stat-value.blue{color:#7fb0ff;}
@media (max-width:860px){
  .dash-grid{grid-template-columns:1fr;}
  .dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
}
@media (max-width:480px){.dash-stats{grid-template-columns:repeat(2,1fr);}}

/* ---------- calendar ---------- */
.cal-card{padding:20px 22px 18px;position:relative;}
.cal-month-summary{
  position:absolute;top:20px;right:22px;text-align:right;
  background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:8px 13px;min-width:104px;
}
.cal-month-summary .stat-label{font-size:9px;}
.cal-month-summary .stat-value{font-size:16px;margin-top:3px;}
.cal-month-summary-pct{font-size:11px;font-weight:700;margin-top:2px;color:var(--text-dim);}
.cal-month-summary-pct.pos{color:var(--pos-text);}
.cal-month-summary-pct.neg{color:var(--red-text);}
@media (max-width:520px){
  .cal-month-summary{position:static;margin:0 0 12px auto;width:fit-content;}
}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 14px;}
.cal-arrow{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
  background:var(--card-2);color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s ease;font-size:14px;
}
.cal-arrow:hover{background:var(--blue);border-color:var(--blue);}
.cal-title{font-family:'Manrope';font-weight:800;font-size:15px;min-width:170px;text-align:center;text-transform:capitalize;}

.cal-toggle{display:flex;justify-content:center;margin-bottom:14px;}
.toggle-group{display:flex;background:var(--card-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.toggle-group button{
  appearance:none;border:none;background:transparent;color:var(--text-dim);
  font-family:'Inter';font-weight:700;font-size:12px;padding:8px 14px;border-radius:999px;cursor:pointer;
  transition:background .18s ease,color .18s ease;
  display:flex;align-items:center;justify-content:center;
}
.toggle-group button svg{width:15px;height:15px;display:block;}
.toggle-group button.active{background:var(--blue);color:#fff;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding-bottom:4px;}
.cal-cell{
  aspect-ratio:1/0.64;border-radius:10px;padding:7px 8px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--card-2);border:1px solid var(--border-soft);
  transition:transform .15s ease, box-shadow .15s ease;
  cursor:default;
}
.cal-cell.empty{background:transparent;border-color:transparent;}
.cal-cell.has-data{cursor:pointer;}
.cal-cell.has-data:hover{transform:translateY(-2px);}
.cal-cell.pos{background:var(--pos-bg-strong);border-color:var(--pos-border);}
.cal-cell.pos:hover{box-shadow:0 6px 18px -6px rgba(167,139,250,.35);}
.cal-cell.neg{background:var(--red-bg-strong);border-color:rgba(248,86,79,.28);}
.cal-cell.neg:hover{box-shadow:0 6px 18px -6px rgba(248,86,79,.35);}
.cal-daynum{font-size:12px;color:var(--text-dim);font-weight:600;}
.cal-cell.pos .cal-daynum{color:var(--pos-text);}
.cal-cell.neg .cal-daynum{color:var(--red-text);}
.cal-value{font-size:14px;font-weight:800;font-family:'Manrope';color:var(--text-dim);letter-spacing:-.2px;}
.cal-cell.pos .cal-value{color:var(--pos-text);}
.cal-cell.neg .cal-value{color:var(--red-text);}
@media (max-width:640px){
  .cal-cell{border-radius:8px;padding:5px 6px;}
  .cal-value{font-size:11px;}
  .cal-daynum{font-size:10px;}
}

.today-outline{outline:1.5px solid rgba(255,255,255,.35);outline-offset:-1.5px;}

/* ---------- monthly chart ---------- */
.chart-card{padding:20px 22px 22px;margin-top:16px;}
.monthly-chart-svg{width:100%;height:auto;display:block;overflow:visible;}
.chart-value-label{font-family:'Manrope';font-weight:700;font-size:11px;}
.chart-axis-label{font-family:'Inter';font-weight:600;font-size:10.5px;fill:var(--text-faint);text-transform:capitalize;}

/* ---------- ranking ---------- */
.ranking-card{padding:20px 22px 22px;margin-top:16px;}
.ranking-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px;}
@media (max-width:720px){.ranking-grid{grid-template-columns:1fr;}}
.ranking-subtitle{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.ranking-subtitle.pos{color:var(--pos-text);}
.ranking-subtitle.neg{color:var(--red-text);}
.ranking-table{width:100%;border-collapse:collapse;}
.ranking-table tr{border-bottom:1px solid var(--border-soft);}
.ranking-table tr:last-child{border-bottom:none;}
.ranking-table td{padding:8px 4px;font-size:13px;}
.rk-pos{color:var(--text-faint);font-weight:700;width:32px;font-family:'Manrope';}
.rk-team{color:var(--text);font-weight:600;}
.rk-value{text-align:right;font-family:'Manrope';font-weight:800;letter-spacing:-.2px;}
.rk-value.pos{color:var(--pos-text);}
.rk-value.neg{color:var(--red-text);}
#ranking-toggle button{font-size:11.5px;padding:7px 16px;}

/* ---------- forms / tables ---------- */
.panel{padding:20px 22px;margin-bottom:18px;}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
input[type=number],input[type=date],input[type=time],input[type=text],input[type=email],input[type=password],select{
  background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;font-family:'Inter';
  outline:none;transition:border-color .15s ease, background .15s ease;
  width:100%;color-scheme:dark;
}
input:focus,select:focus{border-color:var(--blue);background:#0f1319;}
input::placeholder{color:var(--text-faint);}
select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239297a1' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 8px center;background-size:15px;padding-right:28px;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:.6;filter:none;background:transparent;}

.btn{
  appearance:none;border:none;border-radius:999px;cursor:pointer;font-family:'Inter';font-weight:700;
  font-size:13px;padding:10px 18px;transition:transform .1s ease, opacity .15s ease,box-shadow .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 16px -6px rgba(59,130,246,.6);}
.btn-primary:hover{opacity:.92;}
.btn-ghost{background:var(--card-2);color:var(--text-dim);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,.18);}
.btn-sm{padding:7px 13px;font-size:12px;}

.table-wrap{
  overflow-x:auto;border-radius:var(--radius-lg);background:var(--card);box-shadow:var(--shadow-card);
  scrollbar-width:none;-ms-overflow-style:none;cursor:grab;-webkit-user-select:none;user-select:none;
}
.table-wrap::-webkit-scrollbar{display:none;}
.table-wrap.dragging{cursor:grabbing;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
#entradas-table{width:auto;min-width:100%;}
#analises-table{width:auto;min-width:100%;}
thead th{
  text-align:left;font-size:10.2px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);
  padding:12px 8px;font-weight:700;border-bottom:1px solid var(--border-soft);white-space:nowrap;
}
tbody td{padding:8px 6px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tbody tr{transition:background .12s ease;}
tbody tr:hover{background:rgba(255,255,255,.015);}
tbody tr:last-child td{border-bottom:none;}
td input,td select{padding:7px 9px;font-size:13px;width:100%;min-width:0;}
td input[type=date],td input[type=time]{padding:6px 4px;font-size:12.3px;min-width:86px;}
.calc{font-family:'Manrope';font-weight:700;font-size:13px;white-space:nowrap;color:var(--text);}
.calc.pos{color:var(--pos-text);}
.calc.neg{color:var(--red-text);}
#entradas-table th,#analises-table th{text-align:center;}
#entradas-table td:nth-child(6),#entradas-table td:nth-child(7),#entradas-table td:nth-child(8),#entradas-table td:nth-child(9){text-align:center;}
.calc.bare-input{
  appearance:none;-webkit-appearance:none;-moz-appearance:textfield;
  background:transparent;border:none;padding:0;width:100%;text-align:center;
}
.calc.bare-input:focus{background:transparent;border:none;}
.calc.bare-input::-webkit-outer-spin-button,.calc.bare-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.odd-input{max-width:80px;}
.odd-input.calc{
  appearance:none;-webkit-appearance:none;-moz-appearance:textfield;
  background:transparent;border:none;padding:0;width:100%;
  font-family:'Manrope';font-weight:700;font-size:13px;text-align:center;
}
.odd-input.calc:focus{background:transparent;border:none;}
.odd-input.calc:hover{cursor:text;}
.odd-input.calc::-webkit-outer-spin-button,.odd-input.calc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.del-btn{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);
  color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;font-size:14px;
}
.del-btn:hover{background:var(--red-bg);color:var(--red-text);border-color:rgba(248,86,79,.35);}

.icon-add-btn{
  appearance:none;border:none;background:transparent;color:var(--text-faint);
  width:30px;height:30px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;line-height:1;font-weight:500;font-family:'Inter';
  transition:all .15s ease;
}
.icon-add-btn:hover{color:var(--blue);background:var(--blue-dim);}
.icon-add-btn:active{transform:scale(.92);}

.add-row-form td{background:var(--bg-soft);padding-top:12px;padding-bottom:12px;}
.add-row-form{position:relative;}

.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.tag-blue{background:var(--blue-dim);color:#7fb0ff;}
.tag-red{background:var(--red-bg);color:var(--red-text);}
.tag-yellow{background:var(--yellow-bg);color:var(--yellow);}
.tag-gray{background:var(--card-2);color:var(--text-faint);border:1px solid var(--border);}
.tag-pos{background:var(--pos-bg);color:var(--pos-text);}

.search-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:12px 14px;margin-bottom:16px;
}
.search-bar .search-input-wrap{position:relative;flex:1;min-width:180px;}
.search-bar .search-input-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;}
.search-bar input[type=text]{padding-left:32px;}
.search-toggles{display:flex;gap:6px;}
.search-toggle{
  appearance:none;border:1px solid var(--border);background:var(--card-2);color:var(--text-dim);
  font-family:'Inter';font-weight:700;font-size:12px;padding:8px 14px;border-radius:999px;cursor:pointer;
  transition:all .15s ease;white-space:nowrap;
}
.search-toggle:hover{color:var(--text);border-color:rgba(255,255,255,.18);}
.search-toggle.active{background:var(--blue);color:#fff;border-color:var(--blue);}

.filter-banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--blue-dim);border:1px solid rgba(59,130,246,.3);color:#7fb0ff;
  padding:11px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:600;margin-bottom:16px;
}
.filter-banner button{background:none;border:none;color:#7fb0ff;text-decoration:underline;cursor:pointer;font-size:12.5px;font-weight:600;}

.empty-state{padding:36px 20px;text-align:center;color:var(--text-faint);font-size:13.5px;}

/* config chips */
.chip-search{margin-bottom:12px;}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px;}
.chip{
  display:flex;align-items:center;gap:8px;background:var(--card-2);border:1px solid var(--border);
  padding:7px 8px 7px 13px;border-radius:999px;font-size:12.5px;color:var(--text-dim);
}
.chip button{
  width:18px;height:18px;border-radius:50%;border:none;background:rgba(255,255,255,.06);color:var(--text-faint);
  cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.chip button:hover{background:var(--red-bg);color:var(--red-text);}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:760px){.config-grid{grid-template-columns:1fr;}}
.add-inline{display:flex;gap:8px;margin-bottom:14px;}
.add-inline input{flex:1;}

.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px;}

.checkbox{width:17px;height:17px;accent-color:var(--pos);cursor:pointer;}

.loading-screen{
  min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-faint);
}
.spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--blue);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--card-2);border:1px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:600;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- auth screen ---------- */
.auth-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.auth-card{
  width:100%;max-width:340px;padding:28px 26px 26px;display:flex;flex-direction:column;gap:12px;
  animation:fadeUp .42s cubic-bezier(.16,1,.3,1);
}
#auth-form{display:flex;flex-direction:column;gap:12px;margin:0;}
.auth-logo{font-family:'Manrope';font-weight:800;font-size:18px;text-align:center;margin-bottom:4px;}
.auth-card .btn-primary{width:100%;padding:11px 18px;margin-top:4px;}
.auth-error{font-size:12px;color:var(--red-text);min-height:15px;}
.auth-switch{font-size:12.5px;color:var(--text-faint);text-align:center;margin-top:6px;}
.auth-switch button{
  appearance:none;border:none;background:transparent;color:#7fb0ff;font-weight:700;cursor:pointer;font-size:12.5px;
  padding:0 0 0 4px;font-family:'Inter';
}
.auth-switch button:hover{text-decoration:underline;}
.logout-btn{
  appearance:none;border:1px solid var(--border);background:var(--card-2);color:var(--text-faint);
  border-radius:999px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:6px;margin-left:8px;transition:all .15s ease;
}
.logout-btn:hover{color:var(--text);border-color:rgba(255,255,255,.18);}
</style>
</head>
<body>
<div id="auth-screen" class="auth-screen" style="display:none;">
  <div class="auth-card card">
    <div class="auth-logo">Controle</div>
    <div class="section-title" id="auth-title" style="text-align:center;margin-bottom:2px;">Entrar</div>
    <form id="auth-form" autocomplete="on">
      <input type="email" id="auth-email" name="email" placeholder="Email" autocomplete="username" required>

/* ================= HELPERS ================= */
function fmtBRL(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function parseBRL(str){
  if(str===undefined||str===null) return 0;
  let s = String(str).trim().replace(/R\$\s?/gi,"").replace(/[^\d,.-]/g,"");
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return (n*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%";
}
function fmtNum(n,d){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtOdd(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return Number(n).toFixed(2);
}
function betCalc(b){
  const stake = Number(b.stake)||0;
  const retorno = Number(b.retorno)||0;
  // Regra: se o retorno for 0 ou menor que a stake, a odd NÃO é calculada automaticamente.
  const autoOdd = stake>0 && retorno>0 && retorno>=stake;
  let odd = null;
  if(autoOdd) odd = retorno/stake;
  else if(b.oddManual!==undefined && b.oddManual!==null && b.oddManual!=="") odd = Number(b.oddManual);
  const profit = stake>0 ? (retorno-stake) : 0;
  const profitUnits = (stake>0 && state.stakeUnit>0) ? profit/state.stakeUnit : 0;
  return {odd, autoOdd, profit, profitUnits};
}
function computeStats(){
  let profitTotal=0, unitsTotal=0, oddSum=0, oddCount=0, apostado=0, wins=0, decided=0;
  state.bets.forEach(b=>{
    const c = betCalc(b);
    profitTotal += c.profit;
    unitsTotal += c.profitUnits;
    apostado += Number(b.stake)||0;
    if(c.odd!==null){ oddSum+=c.odd; oddCount++; }
    if(Number(b.stake)>0){
      decided++;
      if(c.profit>0) wins++;
    }
  });
  const atual = state.bankrollInicial + profitTotal;
  const roi = apostado>0 ? profitTotal/apostado : 0;
  const taxaAcerto = decided>0 ? wins/decided : 0;
  return {
    inicio: state.bankrollInicial,
    atual,
    oddMedia: oddCount? oddSum/oddCount : 0,
    stake: state.stakeUnit,
    lucroUnidades: unitsTotal,
    lucroReais: profitTotal,
    apostado,
    roi,
    taxaAcerto
  };
}
function dailyProfit(iso){
  return state.bets.filter(b=>b.date===iso).reduce((s,b)=>s+betCalc(b).profit,0);
}
function bankrollBeforeDate(iso){
  const profitAntes = state.bets
    .filter(b=>b.date<iso)
    .reduce((s,b)=>s+betCalc(b).profit,0);
  return state.bankrollInicial + profitAntes;
}
function monthStats(y,m){
  const prefix = `${y}-${pad2(m+1)}-`;
  let profit=0, count=0;
  state.bets.forEach(b=>{
    if(b.date && b.date.startsWith(prefix)){ profit += betCalc(b).profit; count++; }
  });
  const banca = bankrollBeforeDate(isoDate(y,m,1));
  const pct = banca>0 ? profit/banca : 0;
  return {profit, pct, count};
}
function monthlyPerformance(){
  const map = {};
  state.bets.forEach(b=>{
    if(!b.date) return;
    const key = b.date.slice(0,7); // YYYY-MM
    map[key] = (map[key]||0) + betCalc(b).profit;
  });
  const keys = Object.keys(map).sort();
  return keys.map(key=>{
    const [y,m] = key.split("-").map(Number);
    return { key, label: `${MONTHS[m-1].slice(0,3)}/${String(y).slice(2)}`, profit: map[key] };
  });
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function teamInPick(pickText){
  if(!pickText) return null;
  const text = pickText.toLowerCase();
  const sorted = [...state.clubs].sort((a,b)=>b.length-a.length);
  for(const c of sorted){
    const re = new RegExp(`(^|[^a-zà-ÿ0-9])${escapeRegex(c.toLowerCase())}([^a-zà-ÿ0-9]|$)`, "i");
    if(re.test(text)) return c;
  }
  return null;
}
function teamRanking(scope){
  const map = {};
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const prefix = `${y}-${pad2(m+1)}-`;
  state.bets.forEach(b=>{
    if(scope==="month" && !(b.date && b.date.startsWith(prefix))) return;
    const team = teamInPick(b.pick);
    if(!team) return;
    map[team] = (map[team]||0) + betCalc(b).profit;
  });
  const arr = Object.entries(map).map(([team,profit])=>({team,profit}));
  const sortedDesc = [...arr].sort((a,b)=>b.profit-a.profit);
  const top10 = sortedDesc.filter(x=>x.profit>0).slice(0,10);
  const bottom10 = sortedDesc.filter(x=>x.profit<0).slice(-10).reverse();
  return {top10, bottom10};
}
function resolveRegistered(list, value){
  const v = (value||"").trim();
  if(v==="") return "";
  const match = list.find(x=>x.toLowerCase()===v.toLowerCase());
  return match || null;
}
function validateTeamFields(data){
  if(data.champ){
    const matched = resolveRegistered(state.championships, data.champ);
    if(matched===null) return {ok:false, field:"champ", msg:`O campeonato "${data.champ}" não está cadastrado.`};
    data.champ = matched;
  }
  if(data.home){
    const matched = resolveRegistered(state.clubs, data.home);
    if(matched===null) return {ok:false, field:"home", msg:`O clube "${data.home}" não está cadastrado.`};
    data.home = matched;
  }
  if(data.away){
    const matched = resolveRegistered(state.clubs, data.away);
    if(matched===null) return {ok:false, field:"away", msg:`O clube "${data.away}" não está cadastrado.`};
    data.away = matched;
  }
  return {ok:true};
}
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayIso(){ const t=new Date(); return isoDate(t.getFullYear(),t.getMonth(),t.getDate()); }

function optionsHtml(options, selected){
  const blank = `<option value="" ${!selected?"selected":""}>Selecione</option>`;
  return blank + options.map(o=>`<option ${o===selected?"selected":""}>${o}</option>`).join("");
}

function applyTeamSearch(list, term, mandante, visitante){
  const q = (term||"").trim().toLowerCase();
  if(!q) return list;
  return list.filter(item=>{
    const home = (item.home||"").toLowerCase();
    const away = (item.away||"").toLowerCase();
    if(mandante && !visitante) return home.includes(q);
    if(visitante && !mandante) return away.includes(q);
    return home.includes(q) || away.includes(q);
  });
}

function ensureListed(list, value){
  if(!value) return;
  const v = value.trim();
  if(!v) return;
  const exists = list.some(x=>x.toLowerCase()===v.toLowerCase());
  if(!exists){ list.push(v); list.sort((a,b)=>a.localeCompare(b,'pt-BR')); }
}

function statBlock(label, value, cls){
  return `<div class="stat-block"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div></div>`;
}

function renderCalendar(){
  document.getElementById("v-brl").classList.toggle("active", calView==="brl");
  document.getElementById("v-pct").classList.toggle("active", calView==="pct");
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById("cal-title").textContent = `${MONTHS[m]} de ${y}`;

  const ms = monthStats(y,m);
  const summaryEl = document.getElementById("cal-month-summary");
  if(summaryEl){
    summaryEl.innerHTML = `
      <div class="stat-label">Resultado do mês</div>
      <div class="stat-value ${ms.profit>0?'pos':(ms.profit<0?'neg':'')}">${fmtBRL(ms.profit)}</div>
      <div class="cal-month-summary-pct ${ms.profit>0?'pos':(ms.profit<0?'neg':'')}">${fmtPct(ms.pct)}</div>
    `;
  }

  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  let html = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  const today = todayIso();
  cells.forEach(d=>{
    if(d===null){ html += `<div class="cal-cell empty"></div>`; return; }
    const iso = isoDate(y,m,d);
    const profit = dailyProfit(iso);
    const hasData = state.bets.some(b=>b.date===iso);
    let cls = "cal-cell";
    if(hasData) cls += profit>0 ? " pos" : (profit<0 ? " neg" : " has-data");
    if(iso===today) cls += " today-outline";
    let valueHtml = "";
    if(hasData){
      const banca = bankrollBeforeDate(iso);
      const val = calView==="brl" ? fmtBRL(profit) : fmtPct(banca>0 ? profit/banca : 0);
      valueHtml = `<div class="cal-value">${val}</div>`;
    }
    html += `<div class="${cls}" data-iso="${hasData?iso:''}"><div class="cal-daynum">${d}</div>${valueHtml}</div>`;
  });
  const grid = document.getElementById("cal-grid");
  grid.className = "cal-grid";
  grid.innerHTML = html;
  grid.querySelectorAll(".cal-cell[data-iso]").forEach(cell=>{
    const iso = cell.getAttribute("data-iso");
    if(!iso) return;
    cell.addEventListener("click", ()=>{
      entradasFilterDate = iso;
      currentTab = "entradas";
      renderTabs();
    });
  });
}

/* ================= GRÁFICO MENSAL ================= */
function renderMonthlyChart(){
  const box = document.getElementById("monthly-chart");
  if(!box) return;
  const data = monthlyPerformance();
  if(data.length===0){
    box.innerHTML = `<div class="empty-state">Sem lançamentos suficientes para montar o gráfico ainda.</div>`;
    return;
  }
  const shown = data.slice(-12); // últimos 12 meses com dados
  const W = 900, H = 190, padL = 44, padR = 16, padT = 14, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxAbs = Math.max(1, ...shown.map(d=>Math.abs(d.profit)));
  const zeroY = padT + innerH/2;
  const scaleY = (innerH/2 - 6) / maxAbs;
  const n = shown.length;
  const bandW = innerW / n;
  const barW = Math.min(22, bandW*0.32);

  let bars = "", labels = "", gridLines = "";
  gridLines += `<line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="var(--border)" stroke-width="1"/>`;

  shown.forEach((d,i)=>{
    const cx = padL + bandW*i + bandW/2;
    const h = Math.abs(d.profit) * scaleY;
    const y = d.profit>=0 ? zeroY - h : zeroY;
    const color = d.profit>0 ? "var(--pos)" : (d.profit<0 ? "var(--red)" : "var(--text-faint)");
    const labelY = d.profit>=0 ? (zeroY - h - 8) : (zeroY + h + 16);
    bars += `<rect x="${(cx-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="4" fill="${color}" opacity="0.9"><title>${escapeHtml(d.label)}: ${fmtBRL(d.profit)}</title></rect>`;
    bars += `<text x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" class="chart-value-label" fill="${color}">${fmtBRL(d.profit)}</text>`;
    labels += `<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" class="chart-axis-label">${d.label}</text>`;
  });

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="monthly-chart-svg" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    ${bars}
    ${labels}
  </svg>`;
}

            const label = field==="champ" ? "campeonato" : "clube";
            showToast(`Esse ${label} não está cadastrado.`);
            e.target.value = item[field] || "";
            return;
          }
          item[field] = matched;
          e.target.value = matched;
        }
        persist();
        renderAnalises();
        return;
      }
      if(field==="checked"){
        item.checked = e.target.checked;
        if(item.checked && !item.linkedBetId){
          const newBet = {
            id: uid(),
            date: item.date || todayIso(),
            champ: item.champ || "",
            home: item.home || "",
            away: item.away || "",
            pick: "",
            stake: state.stakeUnit,
            retorno: 0,
            oddManual: ""
          };
          state.bets.unshift(newBet);
          item.linkedBetId = newBet.id;
          showToast("Enviado para Entradas");
        }
      }
      else item[field] = e.target.value;
      persist();
      renderAnalises();
    });
  });
  tbody.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.analyses = state.analyses.filter(x=>x.id!==btn.dataset.del);
      persist(); renderAnalises();
      showToast("Análise excluída — Ctrl+Z para desfazer");
    });
  });

  /* ---- adicionar (botão + auto-preenchimento) ---- */
  function readNewAnalysis(){
    return {
      hora: document.getElementById("an-hora").value,
      date: document.getElementById("an-data").value,
      champ: document.getElementById("an-champ").value.trim(),
      home: document.getElementById("an-home").value.trim(),
      away: document.getElementById("an-away").value.trim(),
      sup: document.getElementById("an-sup").value,
      leitura: document.getElementById("an-leitura").value
    };
  }
  let submittingAn = false;
  function submitNewAnalysis(showAlertIfInvalid){
    if(submittingAn) return;
    const data = readNewAnalysis();
    if(!data.home || !data.away){
      if(showAlertIfInvalid) alert("Preencha ao menos Mandante e Visitante.");
      return;
    }
    const v = validateTeamFields(data);
    if(!v.ok){
      showToast(v.msg);
      return;
    }
    submittingAn = true;
    state.analyses.unshift({ id: uid(), checked:false, ...data });
    persist();
    renderAnalises();
  }
  document.getElementById("add-an").addEventListener("click", ()=> submitNewAnalysis(true));
  document.getElementById("add-row-analise").querySelectorAll("input,select").forEach(inp=>{
    inp.addEventListener("change", ()=> submitNewAnalysis(false));
  });

  attachTimeDrag(document.getElementById("an-hora"));
  tbody.querySelectorAll('input[type="time"][data-field="hora"]').forEach(attachTimeDrag);

  attachDragScroll(el.querySelector(".table-wrap"));
}

function renderChampChips(){
  const list = state.championships.filter(c=>c.toLowerCase().includes(champSearch.toLowerCase()));
  const box = document.getElementById("champ-list");
  box.innerHTML = list.length ? list.map(c=>`<div class="chip">${escapeHtml(c)}<button data-remove="${escapeHtml(c)}">&#10005;</button></div>`).join("") : `<div class="empty-state">Nenhum resultado.</div>`;
  box.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.championships = state.championships.filter(c=>c!==btn.dataset.remove);
      persist(); renderChampChips();
    });
  });
}
function renderClubChips(){
  const list = state.clubs.filter(c=>c.toLowerCase().includes(clubSearch.toLowerCase()));

  box.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.clubs = state.clubs.filter(c=>c!==btn.dataset.remove);
      persist(); renderClubChips();
    });
  });
}

/* ================= DRAG TO SCROLL (mouse) ================= */
function attachDragScroll(el){
  if(!el || el._dragBound) return;
  el._dragBound = true;
  let isDown=false, startX=0, startScroll=0, moved=false;
  el.addEventListener("mousedown", e=>{
    if(e.target.closest("input,select,button,textarea")) return;
    isDown = true; moved = false;
    el.classList.add("dragging");
    startX = e.pageX;
    startScroll = el.scrollLeft;
  });
  window.addEventListener("mouseup", ()=>{ isDown=false; el.classList.remove("dragging"); });
  el.addEventListener("mouseleave", ()=>{ isDown=false; el.classList.remove("dragging"); });
  el.addEventListener("mousemove", e=>{
    if(!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    if(Math.abs(dx)>3) moved = true;
    el.scrollLeft = startScroll - dx;
  });
}

/* ================= DRAG TO SWITCH TABS ================= */
function attachTabDrag(navEl){
  const order = ["dashboard","entradas","analises","config"];
  let startX=0, isDown=false, moved=false;
  navEl.addEventListener("mousedown", e=>{
    isDown = true; moved = false; startX = e.clientX;
    navEl.classList.add("dragging");
  });
  window.addEventListener("mousemove", e=>{
    if(!isDown) return;
    if(Math.abs(e.clientX-startX)>8) moved = true;
  });
  window.addEventListener("mouseup", e=>{
    if(!isDown) return;
    isDown = false;
    navEl.classList.remove("dragging");
    if(moved){
      const dx = e.clientX - startX;
      const idx = order.indexOf(currentTab);
      if(dx <= -50 && idx < order.length-1){ currentTab = order[idx+1]; renderTabs(); }
      else if(dx >= 50 && idx > 0){ currentTab = order[idx-1]; renderTabs(); }
    }
  });
  navEl.addEventListener("click", e=>{
    if(moved){ moved = false; return; }
    const btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    currentTab = btn.dataset.tab;
    renderTabs();
  });
}

/* ================= DRAG TO ADJUST TIME (segurar e arrastar p/ cima ou baixo) ================= */
function attachTimeDrag(input){
  let startY=0, startMinutes=0, moved=false, dragging=false;
  input.addEventListener("mousedown", e=>{
    startY = e.clientY; moved = false; dragging = true;
    const parts = (input.value||"00:00").split(":").map(Number);
    startMinutes = (parts[0]||0)*60 + (parts[1]||0);
    const onMove = ev=>{
      const dy = startY - ev.clientY;
      if(Math.abs(dy) > 4){
        if(!moved){ moved = true; input.style.cursor = "ns-resize"; }
        ev.preventDefault();
        const step = Math.round(dy/4); // 4px = 1 minuto
        let total = (startMinutes + step) % 1440;
        if(total<0) total += 1440;
        const hh = String(Math.floor(total/60)).padStart(2,"0");
        const mm = String(total%60).padStart(2,"0");
        input.value = `${hh}:${mm}`;
      }
    };
    const onUp = ()=>{
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      input.style.cursor = "";
      dragging = false;
      if(moved) input.dispatchEvent(new Event("change", {bubbles:true}));
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

function escapeHtml(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

/* ================= INIT ================= */
document.getElementById("auth-form").addEventListener("submit", e=>{
  e.preventDefault();
  handleAuthSubmit();
});
document.getElementById("auth-switch-btn").addEventListener("click", ()=> setAuthMode(authMode==="login" ? "signup" : "login"));

async function boot(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session && session.user){
    if(Date.now() - getLastActivity() >= INACTIVITY_LIMIT_MS){
      // sessão salva, mas passou de 30min sem uso: desloga antes de mostrar o app
      inactivityLogoutPending = true;
      await supabase.auth.signOut();
      return;
    }
    currentUser = session.user;
    hideAuthScreen();
    state = await loadState();
    renderShell();
    subscribeRealtime();
    startActivityTracking();
  } else {
    currentUser = null;
    showAuthScreen("login");
  }
}

supabase.auth.onAuthStateChange((event, session) => {
  if(event === "SIGNED_IN" && (!currentUser || currentUser.id !== session.user.id)){
    currentUser = session.user;
    hideAuthScreen();
    document.getElementById("auth-email").value = "";
    document.getElementById("auth-password").value = "";
    startActivityTracking();
    (async ()=>{
      state = await loadState();
      renderShell();
      subscribeRealtime();
    })();
  } else if(event === "SIGNED_OUT"){
    currentUser = null;
    if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
    stopActivityTracking();
    if(inactivityLogoutPending){
      inactivityLogoutPending = false;
      showAuthScreen("login", "Sessão encerrada após 30 min de inatividade. Entre novamente.");
    } else {
      showAuthScreen("login");
    }
  }
});

boot();

})();
