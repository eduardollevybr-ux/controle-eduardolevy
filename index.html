function renderAnalises(){
  const el = document.getElementById("view-analises");
  let baseRows = analisesFilterDate ? state.analyses.filter(r=>r.date===analisesFilterDate) : state.analyses;
  let rows = applyTeamSearch(baseRows, analisesTeamSearch, analisesMandante, analisesVisitante);
  rows = sortRowsByDate(rows, !!analisesFilterDate, true);

  el.innerHTML = `
    ${analisesFilterDate ? `<div class="filter-banner"><span>Mostrando análises de ${analisesFilterDate.split('-').reverse().join('/')}</span><button id="clear-filter-analises">limpar filtro</button></div>` : ""}
    <div class="search-bar">
      <div class="date-filter-wrap" id="analises-date-filter-wrap">
        <button class="date-filter-icon-btn ${analisesFilterDate?'active':''}" id="analises-date-btn" type="button" title="Filtrar por data">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </button>
        ${analisesCalendarOpen ? renderMiniCalendarHtml("analises-cal", analisesCalendarViewY, analisesCalendarViewM, analisesFilterDate) : ""}
      </div>
      <button class="today-btn ${analisesFilterDate===todayIso()?'active':''}" id="analises-today-btn" type="button">Hoje</button>
      <div class="search-input-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="analises-team-search" placeholder="Buscar equipe…" value="${escapeHtml(analisesTeamSearch)}">
      </div>
      <div class="search-toggles">
        <button class="search-toggle ${analisesMandante?'active':''}" id="analises-toggle-mandante" type="button">Mandante</button>
        <button class="search-toggle ${analisesVisitante?'active':''}" id="analises-toggle-visitante" type="button">Visitante</button>
      </div>
    </div>
    <div class="table-wrap card">
      <table id="analises-table">
        <colgroup>
          <col style="width:74px"><col style="width:74px"><col style="width:230px">
          <col style="width:220px"><col style="width:220px"><col style="width:414px"><col style="width:178px">
          <col style="width:100px">
        </colgroup>
        <thead><tr>
          <th>Hora</th><th>Data</th><th>Campeonato</th><th>Mandante</th><th>Visitante</th>
          <th>Superioridade no jogo</th><th>Leitura de mercado</th><th></th>
        </tr></thead>
        <tbody id="an-tbody">
          <tr class="add-row-form" id="add-row-analise">
            <td data-label="Hora"><input type="time" id="an-hora" value=""></td>
            <td data-label="Data">${renderDateCellHtml("analises","new","date",todayIso(),"an-data")}</td>
            <td data-label="Campeonato"><input type="text" id="an-champ" list="dl-champs2" placeholder="Campeonato"></td>
            <td data-label="Mandante"><input type="text" id="an-home" list="dl-clubs2" placeholder="Mandante"></td>
            <td data-label="Visitante"><input type="text" id="an-away" list="dl-clubs2" placeholder="Visitante"></td>
            <td data-label="Superioridade no jogo">
              <select id="an-sup">${superioridadeOptionsHtml("", "", "")}</select>
            </td>
            <td data-label="Leitura de mercado">
              <select id="an-leitura">${optionsHtml(LEITURA_OPTIONS, "")}</select>
            </td>
            <td data-label=""><button class="icon-add-btn" id="add-an" title="Adicionar">+</button></td>
          </tr>
        </tbody>
      </table>
    </div>
    <datalist id="dl-champs2">${state.championships.map(c=>`<option value="${escapeHtml(c)}">`).join("")}</datalist>
    <datalist id="dl-clubs2">${state.clubs.map(c=>`<option value="${escapeHtml(c)}">`).join("")}</datalist>
  `;

  const tbody = document.getElementById("an-tbody");
  if(rows.length===0){
    const msg = (analisesTeamSearch||analisesMandante||analisesVisitante||analisesFilterDate) ? "Nenhuma análise encontrada para essa busca." : "Nenhuma análise cadastrada ainda.";
    tbody.insertAdjacentHTML("beforeend", `<tr><td colspan="8"><div class="empty-state">${msg}</div></td></tr>`);
  } else {
    tbody.insertAdjacentHTML("beforeend", rows.map(r=>`
      <tr data-id="${r.id}">
        <td data-label="Hora"><input type="time" data-field="hora" value="${r.hora||''}"></td>
        <td data-label="Data">${renderDateCellHtml("analises", r.id, "date", r.date||'', null)}</td>
        <td data-label="Campeonato"><input type="text" data-field="champ" list="dl-champs2" value="${escapeHtml(r.champ||'')}"></td>
        <td data-label="Mandante"><input type="text" data-field="home" list="dl-clubs2" value="${escapeHtml(r.home||'')}"></td>
        <td data-label="Visitante"><input type="text" data-field="away" list="dl-clubs2" value="${escapeHtml(r.away||'')}"></td>
        <td data-label="Superioridade"><select data-field="sup" title="${escapeHtml(r.sup?superioridadeLabel(r.sup,r.home,r.away):'')}">${superioridadeOptionsHtml(r.sup, r.home, r.away)}</select></td>
        <td data-label="Leitura"><select data-field="leitura">${optionsHtml(LEITURA_OPTIONS, r.leitura)}</select></td>
        <td data-label="">
          <div class="row-actions">
            <button class="send-btn ${r.linkedBetId?'sent':''}" data-send="${r.id}" title="${r.linkedBetId?'Enviado para Entradas — clique para desfazer':'Enviar para Entradas'}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></svg>
            </button>
            <button class="del-btn" data-del="${r.id}" title="Excluir">&#10005;</button>
          </div>
        </td>
      </tr>
    `).join(""));
  }

  const clearBtnAn = document.getElementById("clear-filter-analises");
  if(clearBtnAn) clearBtnAn.addEventListener("click", ()=>{ analisesFilterDate=null; renderAnalises(); });

  {
    document.getElementById("analises-date-btn").addEventListener("click", e=>{
      e.stopPropagation(); // impede que o clique feche o calendário no mesmo instante em que o abre
      if(analisesCalendarOpen){
        analisesCalendarOpen = false;
      } else {
        const base = analisesFilterDate || todayIso();
        const [y,m] = base.split("-").map(Number);
        analisesCalendarViewY = y; analisesCalendarViewM = m-1;
        analisesCalendarOpen = true;
      }
      renderAnalises();
    });
    if(analisesCalendarOpen){
      const popover = document.getElementById("analises-cal-popover");
      if(popover) popover.addEventListener("click", e=> e.stopPropagation());
      document.getElementById("analises-cal-prev").addEventListener("click", ()=>{
        analisesCalendarViewM--;
        if(analisesCalendarViewM<0){ analisesCalendarViewM=11; analisesCalendarViewY--; }
        renderAnalises();
      });
      document.getElementById("analises-cal-next").addEventListener("click", ()=>{
        analisesCalendarViewM++;
        if(analisesCalendarViewM>11){ analisesCalendarViewM=0; analisesCalendarViewY++; }
        renderAnalises();
      });
      document.getElementById("analises-cal-today").addEventListener("click", ()=>{
        const t = todayIso();
        const [y,m] = t.split("-").map(Number);
        analisesCalendarViewY = y; analisesCalendarViewM = m-1;
        analisesFilterDate = t;
        analisesCalendarOpen = false;
        renderAnalises();
      });
      document.querySelectorAll("#analises-cal-popover .mini-cal-day[data-iso]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          analisesFilterDate = btn.dataset.iso;
          analisesCalendarOpen = false;
          renderAnalises();
        });
      });
    }
  }
  document.getElementById("analises-today-btn").addEventListener("click", ()=>{
    analisesFilterDate = analisesFilterDate===todayIso() ? null : todayIso();
    renderAnalises();
  });

  document.getElementById("analises-team-search").addEventListener("input", e=>{
    analisesTeamSearch = e.target.value;
    const pos = e.target.selectionStart;
    renderAnalises();
    const inp = document.getElementById("analises-team-search");
    if(inp){ inp.focus(); inp.setSelectionRange(pos,pos); }
  });
  document.getElementById("analises-toggle-mandante").addEventListener("click", ()=>{
    analisesMandante = !analisesMandante; renderAnalises();
  });
  document.getElementById("analises-toggle-visitante").addEventListener("click", ()=>{
    analisesVisitante = !analisesVisitante; renderAnalises();
  });

  attachRestrictedTeamInput(document.getElementById("an-champ"), ()=>state.championships);
  attachRestrictedTeamInput(document.getElementById("an-home"), ()=>state.clubs);
  attachRestrictedTeamInput(document.getElementById("an-away"), ()=>state.clubs);
  tbody.querySelectorAll('tr[data-id] input[data-field="champ"]').forEach(inp=>attachRestrictedTeamInput(inp, ()=>state.championships));
  tbody.querySelectorAll('tr[data-id] input[data-field="home"], tr[data-id] input[data-field="away"]').forEach(inp=>attachRestrictedTeamInput(inp, ()=>state.clubs));

  // atualiza as opções de "Superioridade no jogo" em tempo real enquanto Mandante/Visitante
  // são editados na mesma linha, sem esperar o campo perder o foco.
  tbody.querySelectorAll('tr[data-id]').forEach(tr=>{
    const homeInp = tr.querySelector('input[data-field="home"]');
    const awayInp = tr.querySelector('input[data-field="away"]');
    const supSel = tr.querySelector('select[data-field="sup"]');
    if(!homeInp || !awayInp || !supSel) return;
    const refresh = ()=> refreshSupSelect(supSel, homeInp.value, awayInp.value);
    homeInp.addEventListener("input", refresh);
    awayInp.addEventListener("input", refresh);
  });

  tbody.querySelectorAll("tr[data-id] input, tr[data-id] select").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const tr = e.target.closest("tr");
      const item = state.analyses.find(x=>x.id===tr.dataset.id);
      if(!item) return;
      const field = e.target.dataset.field;
      if(field==="champ" || field==="home" || field==="away"){
        const list = field==="champ" ? state.championships : state.clubs;
        const raw = e.target.value.trim();
        if(raw===""){
          item[field] = "";
        } else {
          const matched = resolveRegistered(list, raw);
          if(matched===null){
            const label = field==="champ" ? "campeonato" : "clube";
            showToast(`Esse ${label} não está cadastrado.`);
            e.target.value = item[field] || "";
            return;
          }
          item[field] = matched;
          e.target.value = matched;
        }
        persist();
        renderAnalises();
        return;
      }
      item[field] = e.target.value;
      if(field==="date" || field==="hora") sortByDateDescInPlace(state.analyses, true);
      persist();
      renderAnalises();
    });
  });
  tbody.querySelectorAll("[data-send]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const tr = btn.closest("tr");
      const item = state.analyses.find(x=>x.id===tr.dataset.id);
      if(!item) return;
      if(!item.linkedBetId){
        const newBet = {
          id: uid(),
          date: item.date || todayIso(),
          champ: item.champ || "",
          home: item.home || "",
          away: item.away || "",
          pick: "",
          stake: state.stakeUnit,
          retorno: 0,
          oddManual: ""
        };
        state.bets.unshift(newBet);
        sortByDateDescInPlace(state.bets);
        item.linkedBetId = newBet.id;
        item.checked = true;
        showToast("Enviado para Entradas");
      } else {
        const existiaEmEntradas = state.bets.some(b=>b.id===item.linkedBetId);
        state.bets = state.bets.filter(b=>b.id!==item.linkedBetId);
        item.linkedBetId = null;
        item.checked = false;
        if(existiaEmEntradas) showToast("Removido de Entradas");
      }
      persist();
      renderAnalises();
    });
  });
  tbody.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.analyses = state.analyses.filter(x=>x.id!==btn.dataset.del);
      persist(); renderAnalises();
      showToast("Análise excluída — Ctrl+Z para desfazer");
    });
  });

  /* ---- adicionar (botão + auto-preenchimento) ---- */
  function readNewAnalysis(){
    return {
      hora: document.getElementById("an-hora").value,
      date: document.getElementById("an-data").value,
      champ: document.getElementById("an-champ").value.trim(),
      home: document.getElementById("an-home").value.trim(),
      away: document.getElementById("an-away").value.trim(),
      sup: document.getElementById("an-sup").value,
      leitura: document.getElementById("an-leitura").value
    };
  }
  let submittingAn = false;
  function submitNewAnalysis(showAlertIfInvalid){
    if(submittingAn) return;
    const data = readNewAnalysis();
    if(!data.home || !data.away){
      if(showAlertIfInvalid) alert("Preencha ao menos Mandante e Visitante.");
      return;
    }
    const v = validateTeamFields(data);
    if(!v.ok){
      showToast(v.msg);
      return;
    }
    submittingAn = true;
    state.analyses.unshift({ id: uid(), checked:false, ...data });
    sortByDateDescInPlace(state.analyses, true);
    persist();
    renderAnalises();
  }
  document.getElementById("add-an").addEventListener("click", ()=> submitNewAnalysis(true));
  document.getElementById("add-row-analise").querySelectorAll("input,select").forEach(inp=>{
    inp.addEventListener("change", ()=> submitNewAnalysis(false));
  });

  attachTimeDrag(document.getElementById("an-hora"));
  tbody.querySelectorAll('input[type="time"][data-field="hora"]').forEach(attachTimeDrag);

  // atualiza as opções de "Superioridade no jogo" em tempo real, conforme o Mandante/Visitante
  // são digitados na linha de nova análise (antes mesmo de confirmar o lançamento)
  const anHomeInput = document.getElementById("an-home");
  const anAwayInput = document.getElementById("an-away");
  const anSupSelect = document.getElementById("an-sup");
  const refreshAnSup = ()=> refreshSupSelect(anSupSelect, anHomeInput.value, anAwayInput.value);
  anHomeInput.addEventListener("input", refreshAnSup);
  anAwayInput.addEventListener("input", refreshAnSup);

  wireRowDatePickers("analises", renderAnalises);

  attachDragScroll(el.querySelector(".table-wrap"));
}

/* ================= CONFIGURAÇÕES ================= */
function renderConfig(){
  const el = document.getElementById("view-config");

  // Preserva o que estiver sendo digitado/focado (ex.: um re-render disparado
  // por eco do Supabase Realtime enquanto o usuário ainda está digitando).
  const active = document.activeElement;
  const focusedId = active && active.id;
  const pendingChamp = document.getElementById("add-champ-input")?.value ?? "";
  const pendingClub = document.getElementById("add-club-input")?.value ?? "";
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  el.innerHTML = `
    <div class="config-grid">
      <div class="card panel">
        <div class="top-row" style="justify-content:center;">
          <div class="section-title" style="margin-bottom:0;">Campeonatos</div>
        </div>
        <div class="add-inline">
          <input type="text" id="add-champ-input" placeholder="Novo campeonato…" value="${escapeHtml(pendingChamp)}">
          <button class="btn btn-primary btn-sm" id="add-champ-btn">Adicionar</button>
          <button class="clear-all-btn" id="clear-champs-btn" type="button" title="Limpar tudo">${broomIconSvg()}</button>
        </div>
        <input type="text" class="chip-search" id="champ-search" placeholder="Buscar campeonato…" value="${escapeHtml(champSearch)}">
        <div class="chip-list" id="champ-list"></div>
      </div>
      <div class="card panel">
        <div class="top-row" style="justify-content:center;">
          <div class="section-title" style="margin-bottom:0;">Clubes</div>
        </div>
        <div class="add-inline">
          <input type="text" id="add-club-input" placeholder="Novo clube…" value="${escapeHtml(pendingClub)}">
          <button class="btn btn-primary btn-sm" id="add-club-btn">Adicionar</button>
          <button class="clear-all-btn" id="clear-clubs-btn" type="button" title="Limpar tudo">${broomIconSvg()}</button>
        </div>
        <input type="text" class="chip-search" id="club-search" placeholder="Buscar clube…" value="${escapeHtml(clubSearch)}">
        <div class="chip-list" id="club-list"></div>
      </div>
    </div>
  `;
  renderChampChips();
  renderClubChips();

  if(focusedId==="add-champ-input" || focusedId==="add-club-input" || focusedId==="champ-search" || focusedId==="club-search"){
    const toFocus = document.getElementById(focusedId);
    if(toFocus){
      toFocus.focus();
      if(selStart!==null) toFocus.setSelectionRange(selStart, selEnd);
    }
  }

  const addChamp = ()=>{

    const inp = document.getElementById("add-champ-input");
    const v = inp.value.trim();
    if(!v) return;
    const added = ensureListed(state.championships, v);
    if(!added){ showToast(`O campeonato "${v}" já está cadastrado.`); return; }
    inp.value=""; persist(); renderChampChips();
  };
  const addClub = ()=>{
    const inp = document.getElementById("add-club-input");
    const v = inp.value.trim();
    if(!v) return;
    const added = ensureListed(state.clubs, v);
    if(!added){ showToast(`O clube "${v}" já está cadastrado.`); return; }
    inp.value=""; persist(); renderClubChips();
  };
  document.getElementById("add-champ-btn").addEventListener("click", addChamp);
  document.getElementById("add-club-btn").addEventListener("click", addClub);
  document.getElementById("add-champ-input").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addChamp(); } });
  document.getElementById("add-club-input").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addClub(); } });
  document.getElementById("champ-search").addEventListener("input", e=>{ champSearch=e.target.value; renderChampChips(); });
  document.getElementById("club-search").addEventListener("input", e=>{ clubSearch=e.target.value; renderClubChips(); });

  document.getElementById("clear-champs-btn").addEventListener("click", ()=>{
    if(state.championships.length===0){ showToast("Não há campeonatos cadastrados."); return; }
    showConfirmModal({
      title: "Limpar todos os campeonatos?",
      message: `Isso vai remover ${state.championships.length===1?"o único campeonato cadastrado":`os ${state.championships.length} campeonatos cadastrados`}. Essa ação não pode ser desfeita, exceto com Ctrl+Z logo em seguida.`,
      confirmLabel: "Limpar tudo",
      onConfirm: ()=>{
        snapshotForUndo();
        state.championships = [];
        persist();
        renderChampChips();
        showToast("Todos os campeonatos foram removidos. Ctrl+Z para desfazer");
      }
    });
  });

  document.getElementById("clear-clubs-btn").addEventListener("click", ()=>{
    if(state.clubs.length===0){ showToast("Não há clubes cadastrados."); return; }
    showConfirmModal({
      title: "Limpar todos os clubes?",
      message: `Isso vai remover ${state.clubs.length===1?"o único clube cadastrado":`os ${state.clubs.length} clubes cadastrados`}. Essa ação não pode ser desfeita, exceto com Ctrl+Z logo em seguida.`,
      confirmLabel: "Limpar tudo",
      onConfirm: ()=>{
        snapshotForUndo();
        state.clubs = [];
        persist();
        renderClubChips();
        showToast("Todos os clubes foram removidos. Ctrl+Z para desfazer");
      }
    });
  });
}

// Ícone de vassourinha usado no botão redondo "Limpar tudo", ao lado do
// botão "Adicionar" em Configurações (Campeonatos/Clubes).
function broomIconSvg(){
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3 6 5 6 21 6"></polyline>
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    <line x1="10" y1="11" x2="10" y2="17"></line>
    <line x1="14" y1="11" x2="14" y2="17"></line>
  </svg>`;
}

function renderChampChips(){
  const list = state.championships.filter(c=>c.toLowerCase().includes(champSearch.toLowerCase()));
  const box = document.getElementById("champ-list");
  box.innerHTML = list.length ? list.map(c=>`<div class="chip">${escapeHtml(c)}<button data-remove="${escapeHtml(c)}">&#10005;</button></div>`).join("") : `<div class="empty-state">Nenhum resultado.</div>`;
  box.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.championships = state.championships.filter(c=>c!==btn.dataset.remove);
      persist(); renderChampChips();
    });
  });
}
function renderClubChips(){
  const list = state.clubs.filter(c=>c.toLowerCase().includes(clubSearch.toLowerCase()));
  const box = document.getElementById("club-list");
  box.innerHTML = list.length ? list.map(c=>`<div class="chip">${escapeHtml(c)}<button data-remove="${escapeHtml(c)}">&#10005;</button></div>`).join("") : `<div class="empty-state">Nenhum resultado.</div>`;
  box.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.clubs = state.clubs.filter(c=>c!==btn.dataset.remove);
      persist(); renderClubChips();
    });
  });
}

/* ================= DRAG TO SCROLL (mouse) ================= */
function attachDragScroll(el){
  if(!el || el._dragBound) return;
  el._dragBound = true;
  let isDown=false, startX=0, startScroll=0, moved=false;
  el.addEventListener("mousedown", e=>{
    if(e.target.closest("input,select,button,textarea")) return;
    isDown = true; moved = false;
    el.classList.add("dragging");
    startX = e.pageX;
    startScroll = el.scrollLeft;
  });
  window.addEventListener("mouseup", ()=>{ isDown=false; el.classList.remove("dragging"); });
  el.addEventListener("mouseleave", ()=>{ isDown=false; el.classList.remove("dragging"); });
  el.addEventListener("mousemove", e=>{
    if(!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    if(Math.abs(dx)>3) moved = true;
    el.scrollLeft = startScroll - dx;
  });
}

/* ================= DRAG TO SWITCH TABS ================= */
function attachTabDrag(navEl){
  const order = ["dashboard","entradas","analises","config"];
  let startX=0, isDown=false, moved=false;
  navEl.addEventListener("mousedown", e=>{
    isDown = true; moved = false; startX = e.clientX;
    navEl.classList.add("dragging");
  });
  window.addEventListener("mousemove", e=>{
    if(!isDown) return;
    if(Math.abs(e.clientX-startX)>8) moved = true;
  });
  window.addEventListener("mouseup", e=>{
    if(!isDown) return;
    isDown = false;
    navEl.classList.remove("dragging");
    if(moved){
      const dx = e.clientX - startX;
      const idx = order.indexOf(currentTab);
      if(dx <= -50 && idx < order.length-1){ currentTab = order[idx+1]; renderTabs(); }
      else if(dx >= 50 && idx > 0){ currentTab = order[idx-1]; renderTabs(); }
    }
  });
  navEl.addEventListener("click", e=>{
    if(moved){ moved = false; return; }
    const btn = e.target.closest("button[data-tab]");
    const isMobile = window.matchMedia("(max-width:700px)").matches;
    if(isMobile){
      if(!navEl.classList.contains("tabs-open")){
        navEl.classList.add("tabs-open");
        return;
      }
      if(btn) currentTab = btn.dataset.tab;
      navEl.classList.remove("tabs-open");
      renderTabs();
      return;
    }
    if(!btn) return;
    currentTab = btn.dataset.tab;
    renderTabs();
  });
  document.addEventListener("click", e=>{
    if(!navEl.classList.contains("tabs-open")) return;
    if(!navEl.contains(e.target)) navEl.classList.remove("tabs-open");
  });
}

/* ================= DRAG TO ADJUST TIME (segurar e arrastar p/ cima ou baixo) ================= */
function attachTimeDrag(input){
  let startY=0, startMinutes=0, moved=false, dragging=false;
  input.addEventListener("mousedown", e=>{
    startY = e.clientY; moved = false; dragging = true;
    const parts = (input.value||"00:00").split(":").map(Number);
    startMinutes = (parts[0]||0)*60 + (parts[1]||0);
    const onMove = ev=>{
      const dy = startY - ev.clientY;
      if(Math.abs(dy) > 4){
        if(!moved){ moved = true; input.style.cursor = "ns-resize"; }
        ev.preventDefault();
        const step = Math.round(dy/4); // 4px = 1 minuto
        let total = (startMinutes + step) % 1440;
        if(total<0) total += 1440;
        const hh = String(Math.floor(total/60)).padStart(2,"0");
        const mm = String(total%60).padStart(2,"0");
        input.value = `${hh}:${mm}`;
      }
    };
    const onUp = ()=>{
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      input.style.cursor = "";
      dragging = false;
      if(moved) input.dispatchEvent(new Event("change", {bubbles:true}));
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

function escapeHtml(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

/* ================= INIT ================= */
document.getElementById("auth-form").addEventListener("submit", e=>{
  e.preventDefault();
  handleAuthSubmit();
});
document.getElementById("auth-switch-btn").addEventListener("click", ()=> setAuthMode(authMode==="login" ? "signup" : "login"));

async function boot(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session && session.user){
    if(Date.now() - getLastActivity() >= INACTIVITY_LIMIT_MS){
      // sessão salva, mas passou de 30min sem uso: desloga antes de mostrar o app
      inactivityLogoutPending = true;
      await supabase.auth.signOut();
      return;
    }
    currentUser = session.user;
    hideAuthScreen();
    state = await loadState();
    renderShell();
    subscribeRealtime();
    startActivityTracking();
  } else {
    currentUser = null;
    showAuthScreen("login");
  }
}

supabase.auth.onAuthStateChange((event, session) => {
  if(event === "SIGNED_IN" && (!currentUser || currentUser.id !== session.user.id)){
    currentUser = session.user;
    hideAuthScreen();
    document.getElementById("auth-email").value = "";
    document.getElementById("auth-password").value = "";
    startActivityTracking();
    (async ()=>{
      state = await loadState();
      renderShell();
      subscribeRealtime();
    })();
  } else if(event === "SIGNED_OUT"){
    currentUser = null;
    if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
    stopActivityTracking();
    if(inactivityLogoutPending){
      inactivityLogoutPending = false;
      showAuthScreen("login", "Sessão encerrada após 30 min de inatividade. Entre novamente.");
    } else {
      showAuthScreen("login");
    }
  }
});

boot();

})();
