<style>
:root{
  color-scheme: var(--cs, dark);
  --cs: dark;
  --bg:#08090b;
  --bg-grad:#101318;
  --bg-soft:#0d0f12;
  --card:#131519;
  --card-2:#181b20;
  --border:rgba(255,255,255,.055);
  --border-soft:rgba(255,255,255,.03);
  --hover-border:rgba(255,255,255,.18);
  --row-hover-bg:rgba(255,255,255,.015);
  --overlay:rgba(255,255,255,.06);
  --scrollbar-thumb:rgba(255,255,255,.12);
  --outline-strong:rgba(255,255,255,.35);
  --shadow-color:rgba(0,0,0,.6);
  --text:#f2f3f5;
  --text-dim:#9297a1;
  --text-faint:#5a5e66;
  --blue:#3b82f6;
  --blue-dim:rgba(59,130,246,.14);
  --pos:#a78bfa;
  --pos-text:#c4b5fd;
  --pos-bg:rgba(167,139,250,.13);
  --pos-bg-strong:#1e1a35;
  --pos-border:rgba(167,139,250,.3);
  --red:#f8564f;
  --red-text:#f87171;
  --red-bg:rgba(248,86,79,.12);
  --red-bg-strong:#2a1414;
  --yellow:#eab308;
  --yellow-bg:rgba(234,179,8,.12);
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px var(--shadow-color);
  --input-focus-bg:#0f1319;
}
:root[data-theme="light"]{
  --cs: light;
  --bg:#f3f4f7;
  --bg-grad:#ffffff;
  --bg-soft:#ffffff;
  --card:#ffffff;
  --card-2:#f2f3f6;
  --border:rgba(15,23,42,.09);
  --border-soft:rgba(15,23,42,.06);
  --hover-border:rgba(15,23,42,.22);
  --row-hover-bg:rgba(15,23,42,.02);
  --overlay:rgba(15,23,42,.055);
  --scrollbar-thumb:rgba(15,23,42,.16);
  --outline-strong:rgba(15,23,42,.4);
  --shadow-color:rgba(15,23,42,.14);
  --text:#14161a;
  --text-dim:#5b6169;
  --text-faint:#9297a1;
  --blue:#2f6fed;
  --blue-dim:rgba(47,111,237,.1);
  --pos:#7c3aed;
  --pos-text:#6d28d9;
  --pos-bg:rgba(124,58,237,.1);
  --pos-bg-strong:#f1ecfd;
  --pos-border:rgba(124,58,237,.28);
  --red:#dc2626;
  --red-text:#dc2626;
  --red-bg:rgba(220,38,38,.08);
  --red-bg-strong:#fdecec;
  --yellow:#b45309;
  --yellow-bg:rgba(180,83,9,.1);
  --shadow-card:0 1px 0 rgba(255,255,255,.6) inset, 0 8px 24px -12px var(--shadow-color);
  --input-focus-bg:#f5f8ff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;color-scheme:var(--cs, dark);}
body{
  background:radial-gradient(1200px 600px at 50% -10%, var(--bg-grad) 0%, var(--bg) 55%) fixed;
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background-color .2s ease, color .2s ease;
}
.num,.stat-value,.money{ font-family:'Manrope',system-ui,sans-serif; }

#app{max-width:1600px;margin:0 auto;padding:0 14px 48px;}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:center;position:relative;
  padding:18px 4px 16px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 78%, transparent);
  backdrop-filter:blur(6px);
}
nav.tabs{
  display:flex;gap:4px;background:var(--card);border:1px solid var(--border);padding:5px;border-radius:999px;
  max-width:100%;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;cursor:grab;
  -webkit-user-select:none;user-select:none;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs.dragging{cursor:grabbing;}
nav.tabs button{
  appearance:none;border:none;background:transparent;color:var(--text-dim);
  font-family:'Inter';font-weight:600;font-size:14px;
  padding:12px 34px;border-radius:999px;cursor:pointer;
  transition:background .18s ease, color .18s ease;
  white-space:nowrap;
}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px -4px rgba(59,130,246,.55);}

.topbar-right{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:10px;
}
.save-pill{
  font-size:11px;color:var(--text-faint);display:flex;align-items:center;gap:6px;
  opacity:0;transition:opacity .25s ease;
}
.save-pill.show{opacity:1;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos);}

.tab-switcher{position:relative;}

/* ---------- mobile-only topbar: tap the active tab to open a picker for all tabs ---------- */
@media (max-width:700px){
  .topbar{justify-content:space-between;padding:14px 6px;gap:8px;}
  .topbar-right{position:static;transform:none;flex:0 0 auto;}
  .tab-switcher{flex:1 1 auto;min-width:0;}

  nav.tabs{padding:4px;border-radius:16px;}
  nav.tabs button{display:none;}
  nav.tabs button.active{
    display:flex;align-items:center;gap:8px;
    padding:11px 15px 11px 18px;cursor:pointer;
    border-radius:12px;
  }
  nav.tabs button.active::after{
    content:"";width:0;height:0;flex:0 0 auto;
    border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid currentColor;opacity:.85;
    transition:transform .2s ease;
  }
  nav.tabs.tabs-open{
    position:absolute;top:0;left:0;z-index:30;
    flex-direction:column;align-items:stretch;gap:2px;
    width:max-content;min-width:190px;max-width:min(80vw,320px);
    border-radius:16px;
    box-shadow:0 14px 32px -12px var(--shadow-color);
  }
  nav.tabs.tabs-open button{
    display:flex !important;
    justify-content:flex-start;text-align:left;
    padding:12px 16px;border-radius:12px;width:100%;
  }
  nav.tabs.tabs-open button.active::after{transform:rotate(180deg);}
}

/* ---------- generic ---------- */
.view{display:none;}
.view.active{display:block;animation:fadeUp .42s cubic-bezier(.16,1,.3,1);}
@keyframes fadeUp{
  0%{opacity:0;transform:translateY(16px) scale(.985);filter:blur(2px);}
  55%{opacity:1;filter:blur(0);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
}
.section-title{
  font-family:'Manrope';font-weight:800;font-size:12.5px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--text-dim);margin:0 0 12px;
}
.hint{font-size:12px;color:var(--text-faint);line-height:1.5;}

/* ---------- dashboard layout ---------- */
.dash-grid{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:stretch;margin-top:6px;}
.dash-grid>*{min-width:0;}
.dash-stats{display:flex;flex-direction:column;gap:8px;}
.stat-block{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:13px 16px;transition:background .18s ease, transform .15s ease;
  animation:fadeUp .4s ease both;
}
.stat-block:hover{background:var(--card-2);}
.stat-label{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-faint);font-weight:600;}
.stat-value{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-value.pos{color:var(--pos-text);}
.stat-value.neg{color:var(--red-text);}
.stat-value.blue{color:#7fb0ff;}
@media (max-width:860px){
  .dash-grid{grid-template-columns:1fr;}
  .dash-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
}
@media (max-width:480px){.dash-stats{grid-template-columns:repeat(2,minmax(0,1fr));}}

/* ---------- calendar ---------- */
.cal-card{padding:20px 22px 18px;position:relative;}
.cal-month-summary{
  position:absolute;top:20px;right:22px;text-align:right;
  background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:8px 13px;min-width:104px;
}
.cal-month-summary .stat-label{font-size:9px;}
.cal-month-summary .stat-value{font-size:16px;margin-top:3px;}
.cal-month-summary-pct{font-size:11px;font-weight:700;margin-top:2px;color:var(--text-dim);}
.cal-month-summary-pct.pos{color:var(--pos-text);}
.cal-month-summary-pct.neg{color:var(--red-text);}
@media (max-width:860px){
  .cal-month-summary{position:static;margin:0 0 12px auto;width:fit-content;max-width:100%;}
}
@media (max-width:700px){
  .cal-month-summary{
    margin:0 auto 12px;width:fit-content;max-width:100%;
    padding:5px 14px;min-width:0;
    display:flex;align-items:baseline;gap:8px;
    border-radius:999px;
  }
  .cal-month-summary .stat-label{display:none;}
  .cal-month-summary .stat-value{font-size:14px;margin-top:0;}
  .cal-month-summary-pct{font-size:11px;margin-top:0;}
}

function markActivity(){
  try{ window.localStorage.setItem(LAST_ACTIVITY_KEY, String(Date.now())); }catch(e){}

function getLastActivity(){
  const v = window.localStorage.getItem(LAST_ACTIVITY_KEY);

}

function startActivityTracking(){
  markActivity();
  ACTIVITY_EVENTS.forEach(evt => document.addEventListener(evt, markActivity, { passive:true }));
  document.addEventListener("visibilitychange", onVisibilityChangeCheck);
  clearInterval(inactivityInterval);
  inactivityInterval = setInterval(checkInactivity, 30000); // confere a cada 30s
}
function stopActivityTracking(){
  ACTIVITY_EVENTS.forEach(evt => document.removeEventListener(evt, markActivity));
  document.removeEventListener("visibilitychange", onVisibilityChangeCheck);
  clearInterval(inactivityInterval);
  inactivityInterval = null;
}

async function loadState(){

      .from("app_state")
      .select("data")

        .from("app_state")
        .upsert({ user_id: currentUser.id, data: state, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
      if(error) throw error;
    }catch(e){ console.error("Falha ao salvar:", e); showToast("Erro ao salvar - verifique a conexão"); }

function subscribeRealtime(){
  if(realtimeChannel) supabase.removeChannel(realtimeChannel);

    .channel("app_state_changes_" + currentUser.id)
    .on("postgres_changes",
      { event: "UPDATE", schema: "public", table: "app_state", filter: `user_id=eq.${currentUser.id}` },
      (payload) => {
        applyingRemote = true;
        state = Object.assign(defaultState(), payload.new.data);

    .subscribe();

async function handleAuthSubmit(){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const errEl = document.getElementById("auth-error");
  errEl.textContent = "";
  if(!email || !password){ errEl.textContent = "Preencha email e senha."; return; }
  const btn = document.getElementById("auth-submit");
  btn.disabled = true;
  try{
    if(authMode==="login"){
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if(error) throw error;
    } else {
      const { error } = await supabase.auth.signUp({ email, password });

  }catch(e){

function traduzErroAuth(msg){
  if(/invalid login credentials/i.test(msg)) return "Email ou senha incorretos.";
  if(/email not confirmed/i.test(msg)) return "Você ainda não confirmou seu email. Verifique sua caixa de entrada (e o spam) e clique no link de confirmação antes de entrar.";
  if(/already registered|already exists/i.test(msg)) return "Este email já tem uma conta.";
  if(/password.*least/i.test(msg)) return "A senha precisa ter pelo menos 6 caracteres.";
  return msg;
}

/* ================= HELPERS ================= */
function fmtBRL(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function parseBRL(str){
  if(str===undefined||str===null) return 0;
  let s = String(str).trim().replace(/R\$\s?/gi,"").replace(/[^\d,.-]/g,"");
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return (n*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%";
}
function fmtNum(n,d){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtOdd(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return Number(n).toFixed(2);
}
function betCalc(b){
  const stake = Number(b.stake)||0;
  const retorno = Number(b.retorno)||0;
  // Regra: se o retorno for 0 ou menor que a stake, a odd NÃO é calculada automaticamente.
  const autoOdd = stake>0 && retorno>0 && retorno>=stake;
  let odd = null;
  if(autoOdd) odd = retorno/stake;
  else if(b.oddManual!==undefined && b.oddManual!==null && b.oddManual!=="") odd = Number(b.oddManual);
  const profit = stake>0 ? (retorno-stake) : 0;
  const profitUnits = (stake>0 && state.stakeUnit>0) ? profit/state.stakeUnit : 0;
  return {odd, autoOdd, profit, profitUnits};
}
function computeStats(){
  let profitTotal=0, unitsTotal=0, oddSum=0, oddCount=0, apostado=0, wins=0, decided=0;
  state.bets.forEach(b=>{
    const c = betCalc(b);
    profitTotal += c.profit;
    unitsTotal += c.profitUnits;
    apostado += Number(b.stake)||0;
    if(c.odd!==null){ oddSum+=c.odd; oddCount++; }
    if(Number(b.stake)>0){
      decided++;
      if(c.profit>0) wins++;
    }
  });
  const atual = state.bankrollInicial + profitTotal;
  const roi = apostado>0 ? profitTotal/apostado : 0;
  const taxaAcerto = decided>0 ? wins/decided : 0;
  return {
    inicio: state.bankrollInicial,
    atual,
    oddMedia: oddCount? oddSum/oddCount : 0,
    stake: state.stakeUnit,
    lucroUnidades: unitsTotal,
    lucroReais: profitTotal,
    apostado,
    roi,
    taxaAcerto
  };
}
function dailyProfit(iso){
  return state.bets.filter(b=>b.date===iso).reduce((s,b)=>s+betCalc(b).profit,0);
}
function bankrollBeforeDate(iso){
  const profitAntes = state.bets
    .filter(b=>b.date<iso)
    .reduce((s,b)=>s+betCalc(b).profit,0);
  return state.bankrollInicial + profitAntes;
}
function monthStats(y,m){
  const prefix = `${y}-${pad2(m+1)}-`;
  let profit=0, count=0;
  state.bets.forEach(b=>{
    if(b.date && b.date.startsWith(prefix)){ profit += betCalc(b).profit; count++; }
  });
  const banca = bankrollBeforeDate(isoDate(y,m,1));
  const pct = banca>0 ? profit/banca : 0;
  return {profit, pct, count};
}
function monthlyPerformance(){
  const map = {};
  state.bets.forEach(b=>{
    if(!b.date) return;
    const key = b.date.slice(0,7); // YYYY-MM
    map[key] = (map[key]||0) + betCalc(b).profit;
  });
  const keys = Object.keys(map).sort();
  return keys.map(key=>{
    const [y,m] = key.split("-").map(Number);
    return { key, label: `${MONTHS[m-1].slice(0,3)}/${String(y).slice(2)}`, profit: map[key] };
  });
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function teamInPick(pickText){
  if(!pickText) return null;
  const text = pickText.toLowerCase();
  const sorted = [...state.clubs].sort((a,b)=>b.length-a.length);
  for(const c of sorted){
    const re = new RegExp(`(^|[^a-zà-ÿ0-9])${escapeRegex(c.toLowerCase())}([^a-zà-ÿ0-9]|$)`, "i");
    if(re.test(text)) return c;
  }
  return null;
}
function teamRanking(scope){
  const map = {};
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const prefix = `${y}-${pad2(m+1)}-`;
  state.bets.forEach(b=>{
    if(scope==="month" && !(b.date && b.date.startsWith(prefix))) return;
    const team = teamInPick(b.pick);
    if(!team) return;
    map[team] = (map[team]||0) + betCalc(b).profit;
  });
  const arr = Object.entries(map).map(([team,profit])=>({team,profit}));
  const sortedDesc = [...arr].sort((a,b)=>b.profit-a.profit);
  const top10 = sortedDesc.filter(x=>x.profit>0).slice(0,10);
  const bottom10 = sortedDesc.filter(x=>x.profit<0).slice(-10).reverse();
  return {top10, bottom10};
}
function resolveRegistered(list, value){
  const v = (value||"").trim();
  if(v==="") return "";
  const match = list.find(x=>x.toLowerCase()===v.toLowerCase());
  return match || null;
}
function validateTeamFields(data){
  if(data.champ){
    const matched = resolveRegistered(state.championships, data.champ);
    if(matched===null) return {ok:false, field:"champ", msg:`O campeonato "${data.champ}" não está cadastrado.`};
    data.champ = matched;
  }
  if(data.home){
    const matched = resolveRegistered(state.clubs, data.home);
    if(matched===null) return {ok:false, field:"home", msg:`O clube "${data.home}" não está cadastrado.`};
    data.home = matched;
  }
  if(data.away){
    const matched = resolveRegistered(state.clubs, data.away);
    if(matched===null) return {ok:false, field:"away", msg:`O clube "${data.away}" não está cadastrado.`};
    data.away = matched;
  }
  return {ok:true};
}
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayIso(){ const t=new Date(); return isoDate(t.getFullYear(),t.getMonth(),t.getDate()); }

function optionsHtml(options, selected){
  const blank = `<option value="" ${!selected?"selected":""}>Selecione</option>`;
  return blank + options.map(o=>`<option ${o===selected?"selected":""}>${o}</option>`).join("");
}

function applyTeamSearch(list, term, mandante, visitante){
  const q = (term||"").trim().toLowerCase();
  if(!q) return list;
  return list.filter(item=>{
    const home = (item.home||"").toLowerCase();
    const away = (item.away||"").toLowerCase();
    if(mandante && !visitante) return home.includes(q);
    if(visitante && !mandante) return away.includes(q);
    return home.includes(q) || away.includes(q);
  });
}

function attachRestrictedTeamInput(inputEl, getList){
  if(!inputEl || inputEl.dataset.restrictedBound) return;
  inputEl.dataset.restrictedBound = "1";
  let lastValid = inputEl.value || "";
  inputEl.addEventListener("input", ()=>{
    const val = inputEl.value;
    if(val===""){ lastValid=""; return; }
    const lower = val.toLowerCase();
    const list = getList();
    const ok = list.some(item=>item.toLowerCase().startsWith(lower));
    if(ok){
      lastValid = val;
    } else {
      const pos = Math.max(0, inputEl.selectionStart - 1);
      inputEl.value = lastValid;
      inputEl.setSelectionRange(pos,pos);
    }
  });
}

function ensureListed(list, value){
  if(!value) return true;
  const v = value.trim();
  if(!v) return true;
  const exists = list.some(x=>x.toLowerCase()===v.toLowerCase());
  if(exists) return false;
  list.push(v); list.sort((a,b)=>a.localeCompare(b,'pt-BR'));
  return true;
}

function statBlock(label, value, cls){
  return `<div class="stat-block"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div></div>`;
}

function renderCalendar(){
  document.getElementById("v-brl").classList.toggle("active", calView==="brl");
  document.getElementById("v-pct").classList.toggle("active", calView==="pct");
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById("cal-title").textContent = `${MONTHS[m]} de ${y}`;

  const ms = monthStats(y,m);
  const summaryEl = document.getElementById("cal-month-summary");
  if(summaryEl){
    summaryEl.innerHTML = `
      <div class="stat-label">Resultado do mês</div>
      <div class="stat-value ${ms.profit>0?'pos':(ms.profit<0?'neg':'')}">${fmtBRL(ms.profit)}</div>
      <div class="cal-month-summary-pct ${ms.profit>0?'pos':(ms.profit<0?'neg':'')}">${fmtPct(ms.pct)}</div>
    `;
  }

  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  let html = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  const today = todayIso();
  cells.forEach(d=>{
    if(d===null){ html += `<div class="cal-cell empty"></div>`; return; }
    const iso = isoDate(y,m,d);
    const profit = dailyProfit(iso);
    const hasData = state.bets.some(b=>b.date===iso);
    let cls = "cal-cell";
    if(hasData) cls += profit>0 ? " pos" : (profit<0 ? " neg" : " has-data");
    if(iso===today) cls += " today-outline";
    let valueHtml = "";
    if(hasData){
      const banca = bankrollBeforeDate(iso);
      const val = calView==="brl" ? fmtBRL(profit) : fmtPct(banca>0 ? profit/banca : 0);
      valueHtml = `<div class="cal-value">${val}</div>`;
    }
    html += `<div class="${cls}" data-iso="${hasData?iso:''}"><div class="cal-daynum">${d}</div>${valueHtml}</div>`;
  });
  const grid = document.getElementById("cal-grid");
  grid.className = "cal-grid";
  grid.innerHTML = html;
  grid.querySelectorAll(".cal-cell[data-iso]").forEach(cell=>{
    const iso = cell.getAttribute("data-iso");
    if(!iso) return;
    cell.addEventListener("click", ()=>{
      entradasFilterDate = iso;
      currentTab = "entradas";
      renderTabs();
    });
  });
}

/* ================= GRÁFICO MENSAL ================= */
function renderMonthlyChart(){
  const box = document.getElementById("monthly-chart");
  if(!box) return;
  const data = monthlyPerformance();
  if(data.length===0){
    box.innerHTML = `<div class="empty-state">Sem lançamentos suficientes para montar o gráfico ainda.</div>`;
    return;
  }
  // largura real do container: usar como unidades do viewBox mantém o texto/traços
  // em tamanho legível em qualquer tela (em vez de um viewBox fixo de 900, que no
  // mobile é escalado para baixo e encolhe tudo, inclusive as fontes, junto com as barras).
  const containerW = box.clientWidth || box.parentElement?.clientWidth || window.innerWidth - 80;
  const W = Math.max(300, Math.min(900, Math.round(containerW)));
  const isCompact = W < 560;
  const shown = data.slice(isCompact ? -6 : -12); // menos meses no mobile = barras mais largas e legíveis
  const H = isCompact ? 240 : 190;
  const padL = isCompact ? 34 : 44, padR = isCompact ? 8 : 16, padT = 14, padB = isCompact ? 30 : 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxAbs = Math.max(1, ...shown.map(d=>Math.abs(d.profit)));
  const zeroY = padT + innerH/2;
  const scaleY = (innerH/2 - 6) / maxAbs;
  const n = shown.length;
  const bandW = innerW / n;
  const barW = Math.min(22, bandW*0.32);

  let bars = "", labels = "", gridLines = "";
  gridLines += `<line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="var(--border)" stroke-width="1"/>`;

  shown.forEach((d,i)=>{
    const cx = padL + bandW*i + bandW/2;
    const h = Math.abs(d.profit) * scaleY;
    const y = d.profit>=0 ? zeroY - h : zeroY;
    const color = d.profit>0 ? "var(--pos)" : (d.profit<0 ? "var(--red)" : "var(--text-faint)");
    const labelY = d.profit>=0 ? (zeroY - h - 8) : (zeroY + h + 16);
    bars += `<rect x="${(cx-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="4" fill="${color}" opacity="0.9"><title>${escapeHtml(d.label)}: ${fmtBRL(d.profit)}</title></rect>`;
    bars += `<text x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" class="chart-value-label" fill="${color}">${fmtBRL(d.profit)}</text>`;
    labels += `<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" class="chart-axis-label">${d.label}</text>`;
  });

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="monthly-chart-svg" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    ${bars}
    ${labels}
  </svg>`;
}

        <td data-label="Superioridade"><select data-field="sup">${optionsHtml(SUPERIORIDADE_OPTIONS, r.sup)}</select></td>
        <td data-label="Leitura"><select data-field="leitura">${optionsHtml(LEITURA_OPTIONS, r.leitura)}</select></td>
        <td data-label=""><button class="del-btn" data-del="${r.id}" title="Excluir">&#10005;</button></td>
      </tr>
    `).join(""));
  }

  document.getElementById("analises-team-search").addEventListener("input", e=>{
    analisesTeamSearch = e.target.value;
    const pos = e.target.selectionStart;
    renderAnalises();
    const inp = document.getElementById("analises-team-search");
    if(inp){ inp.focus(); inp.setSelectionRange(pos,pos); }
  });
  document.getElementById("analises-toggle-mandante").addEventListener("click", ()=>{
    analisesMandante = !analisesMandante; renderAnalises();
  });
  document.getElementById("analises-toggle-visitante").addEventListener("click", ()=>{
    analisesVisitante = !analisesVisitante; renderAnalises();
  });

  attachRestrictedTeamInput(document.getElementById("an-champ"), ()=>state.championships);
  attachRestrictedTeamInput(document.getElementById("an-home"), ()=>state.clubs);
  attachRestrictedTeamInput(document.getElementById("an-away"), ()=>state.clubs);
  tbody.querySelectorAll('tr[data-id] input[data-field="champ"]').forEach(inp=>attachRestrictedTeamInput(inp, ()=>state.championships));
  tbody.querySelectorAll('tr[data-id] input[data-field="home"], tr[data-id] input[data-field="away"]').forEach(inp=>attachRestrictedTeamInput(inp, ()=>state.clubs));

  tbody.querySelectorAll("tr[data-id] input, tr[data-id] select").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const tr = e.target.closest("tr");
      const item = state.analyses.find(x=>x.id===tr.dataset.id);
      if(!item) return;
      const field = e.target.dataset.field;
      if(field==="champ" || field==="home" || field==="away"){
        const list = field==="champ" ? state.championships : state.clubs;
        const raw = e.target.value.trim();
        if(raw===""){
          item[field] = "";
        } else {
          const matched = resolveRegistered(list, raw);
          if(matched===null){
            const label = field==="champ" ? "campeonato" : "clube";
            showToast(`Esse ${label} não está cadastrado.`);
            e.target.value = item[field] || "";
            return;
          }
          item[field] = matched;
          e.target.value = matched;
        }
        persist();
        renderAnalises();
        return;
      }
      if(field==="checked"){
        item.checked = e.target.checked;
        if(item.checked && !item.linkedBetId){
          const newBet = {
            id: uid(),
            date: item.date || todayIso(),
            champ: item.champ || "",
            home: item.home || "",
            away: item.away || "",
            pick: "",
            stake: state.stakeUnit,
            retorno: 0,
            oddManual: ""
          };
          state.bets.unshift(newBet);
          item.linkedBetId = newBet.id;
          showToast("Enviado para Entradas");
        }
      }
      else item[field] = e.target.value;
      persist();
      renderAnalises();
    });
  });
  tbody.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.analyses = state.analyses.filter(x=>x.id!==btn.dataset.del);
      persist(); renderAnalises();
      showToast("Análise excluída — Ctrl+Z para desfazer");
    });
  });

  /* ---- adicionar (botão + auto-preenchimento) ---- */
  function readNewAnalysis(){
    return {
      hora: document.getElementById("an-hora").value,
      date: document.getElementById("an-data").value,
      champ: document.getElementById("an-champ").value.trim(),
      home: document.getElementById("an-home").value.trim(),
      away: document.getElementById("an-away").value.trim(),
      sup: document.getElementById("an-sup").value,
      leitura: document.getElementById("an-leitura").value
    };
  }
  let submittingAn = false;
  function submitNewAnalysis(showAlertIfInvalid){
    if(submittingAn) return;
    const data = readNewAnalysis();
    if(!data.home || !data.away){
      if(showAlertIfInvalid) alert("Preencha ao menos Mandante e Visitante.");
      return;
    }
    const v = validateTeamFields(data);
    if(!v.ok){
      showToast(v.msg);
      return;
    }
    submittingAn = true;
    state.analyses.unshift({ id: uid(), checked:false, ...data });
    persist();
    renderAnalises();
  }
  document.getElementById("add-an").addEventListener("click", ()=> submitNewAnalysis(true));
  document.getElementById("add-row-analise").querySelectorAll("input,select").forEach(inp=>{
    inp.addEventListener("change", ()=> submitNewAnalysis(false));
  });

  attachTimeDrag(document.getElementById("an-hora"));
  tbody.querySelectorAll('input[type="time"][data-field="hora"]').forEach(attachTimeDrag);

  attachDragScroll(el.querySelector(".table-wrap"));
}

      <div class="card panel">
        <div class="section-title">Campeonatos</div>
        <div class="add-inline">
          <input type="text" id="add-champ-input" placeholder="Novo campeonato…">
          <button class="btn btn-primary btn-sm" id="add-champ-btn">Adicionar</button>
        </div>
        <input type="text" class="chip-search" id="champ-search" placeholder="Buscar campeonato…" value="${escapeHtml(champSearch)}">
        <div class="chip-list" id="champ-list"></div>
      </div>
      <div class="card panel">
        <div class="section-title">Clubes</div>
        <div class="add-inline">
          <input type="text" id="add-club-input" placeholder="Novo clube…">
          <button class="btn btn-primary btn-sm" id="add-club-btn">Adicionar</button>
        </div>
        <input type="text" class="chip-search" id="club-search" placeholder="Buscar clube…" value="${escapeHtml(clubSearch)}">
        <div class="chip-list" id="club-list"></div>

    </div>
  `;

    const added = ensureListed(state.championships, v);
    if(!added){ showToast(`O campeonato "${v}" já está cadastrado.`); return; }
    inp.value=""; persist(); renderChampChips();
  });
  document.getElementById("add-club-btn").addEventListener("click", ()=>{

    const v = inp.value.trim();
    if(!v) return;
    const added = ensureListed(state.clubs, v);
    if(!added){ showToast(`O clube "${v}" já está cadastrado.`); return; }
    inp.value=""; persist(); renderClubChips();
  });
  document.getElementById("champ-search").addEventListener("input", e=>{ champSearch=e.target.value; renderChampChips(); });

function renderChampChips(){
  const list = state.championships.filter(c=>c.toLowerCase().includes(champSearch.toLowerCase()));
  const box = document.getElementById("champ-list");
  box.innerHTML = list.length ? list.map(c=>`<div class="chip">${escapeHtml(c)}<button data-remove="${escapeHtml(c)}">&#10005;</button></div>`).join("") : `<div class="empty-state">Nenhum resultado.</div>`;
  box.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.championships = state.championships.filter(c=>c!==btn.dataset.remove);
      persist(); renderChampChips();
    });
  });
}
function renderClubChips(){
  const list = state.clubs.filter(c=>c.toLowerCase().includes(clubSearch.toLowerCase()));
  const box = document.getElementById("club-list");
  box.innerHTML = list.length ? list.map(c=>`<div class="chip">${escapeHtml(c)}<button data-remove="${escapeHtml(c)}">&#10005;</button></div>`).join("") : `<div class="empty-state">Nenhum resultado.</div>`;
  box.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.clubs = state.clubs.filter(c=>c!==btn.dataset.remove);
      persist(); renderClubChips();
    });
  });
}

/* ================= DRAG TO SCROLL (mouse) ================= */
function attachDragScroll(el){
  if(!el || el._dragBound) return;
  el._dragBound = true;
  let isDown=false, startX=0, startScroll=0, moved=false;
  el.addEventListener("mousedown", e=>{
    if(e.target.closest("input,select,button,textarea")) return;
    isDown = true; moved = false;
    el.classList.add("dragging");
    startX = e.pageX;
    startScroll = el.scrollLeft;
  });
  window.addEventListener("mouseup", ()=>{ isDown=false; el.classList.remove("dragging"); });
  el.addEventListener("mouseleave", ()=>{ isDown=false; el.classList.remove("dragging"); });
  el.addEventListener("mousemove", e=>{
    if(!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    if(Math.abs(dx)>3) moved = true;
    el.scrollLeft = startScroll - dx;
  });
}

/* ================= DRAG TO SWITCH TABS ================= */
function attachTabDrag(navEl){
  const order = ["dashboard","entradas","analises","config"];
  let startX=0, isDown=false, moved=false;
  navEl.addEventListener("mousedown", e=>{
    isDown = true; moved = false; startX = e.clientX;
    navEl.classList.add("dragging");
  });
  window.addEventListener("mousemove", e=>{
    if(!isDown) return;
    if(Math.abs(e.clientX-startX)>8) moved = true;
  });
  window.addEventListener("mouseup", e=>{
    if(!isDown) return;
    isDown = false;
    navEl.classList.remove("dragging");
    if(moved){
      const dx = e.clientX - startX;
      const idx = order.indexOf(currentTab);
      if(dx <= -50 && idx < order.length-1){ currentTab = order[idx+1]; renderTabs(); }
      else if(dx >= 50 && idx > 0){ currentTab = order[idx-1]; renderTabs(); }
    }
  });
  navEl.addEventListener("click", e=>{
    if(moved){ moved = false; return; }
    const btn = e.target.closest("button[data-tab]");
    const isMobile = window.matchMedia("(max-width:700px)").matches;
    if(isMobile){
      if(!navEl.classList.contains("tabs-open")){
        navEl.classList.add("tabs-open");
        return;
      }
      if(btn) currentTab = btn.dataset.tab;
      navEl.classList.remove("tabs-open");
      renderTabs();
      return;
    }
    if(!btn) return;
    currentTab = btn.dataset.tab;
    renderTabs();
  });
  document.addEventListener("click", e=>{
    if(!navEl.classList.contains("tabs-open")) return;
    if(!navEl.contains(e.target)) navEl.classList.remove("tabs-open");
  });
}

/* ================= DRAG TO ADJUST TIME (segurar e arrastar p/ cima ou baixo) ================= */
function attachTimeDrag(input){
  let startY=0, startMinutes=0, moved=false, dragging=false;
  input.addEventListener("mousedown", e=>{
    startY = e.clientY; moved = false; dragging = true;
    const parts = (input.value||"00:00").split(":").map(Number);
    startMinutes = (parts[0]||0)*60 + (parts[1]||0);
    const onMove = ev=>{
      const dy = startY - ev.clientY;
      if(Math.abs(dy) > 4){
        if(!moved){ moved = true; input.style.cursor = "ns-resize"; }
        ev.preventDefault();
        const step = Math.round(dy/4); // 4px = 1 minuto
        let total = (startMinutes + step) % 1440;
        if(total<0) total += 1440;
        const hh = String(Math.floor(total/60)).padStart(2,"0");
        const mm = String(total%60).padStart(2,"0");
        input.value = `${hh}:${mm}`;
      }
    };
    const onUp = ()=>{
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      input.style.cursor = "";
      dragging = false;
      if(moved) input.dispatchEvent(new Event("change", {bubbles:true}));
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

function escapeHtml(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

/* ================= INIT ================= */
document.getElementById("auth-form").addEventListener("submit", e=>{
  e.preventDefault();
  handleAuthSubmit();
});
document.getElementById("auth-switch-btn").addEventListener("click", ()=> setAuthMode(authMode==="login" ? "signup" : "login"));

async function boot(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session && session.user){
    if(Date.now() - getLastActivity() >= INACTIVITY_LIMIT_MS){
      // sessão salva, mas passou de 30min sem uso: desloga antes de mostrar o app
      inactivityLogoutPending = true;
      await supabase.auth.signOut();
      return;
    }
    currentUser = session.user;
    hideAuthScreen();
    state = await loadState();
    renderShell();
    subscribeRealtime();
    startActivityTracking();
  } else {
    currentUser = null;
    showAuthScreen("login");
  }
}

supabase.auth.onAuthStateChange((event, session) => {
  if(event === "SIGNED_IN" && (!currentUser || currentUser.id !== session.user.id)){
    currentUser = session.user;
    hideAuthScreen();
    document.getElementById("auth-email").value = "";
    document.getElementById("auth-password").value = "";
    startActivityTracking();
    (async ()=>{
      state = await loadState();
      renderShell();
      subscribeRealtime();
    })();
  } else if(event === "SIGNED_OUT"){
    currentUser = null;
    if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
    stopActivityTracking();
    if(inactivityLogoutPending){
      inactivityLogoutPending = false;
      showAuthScreen("login", "Sessão encerrada após 30 min de inatividade. Entre novamente.");
    } else {
      showAuthScreen("login");
    }
  }
});

boot();

})();
