<style>
:root{
  color-scheme: var(--cs, dark);
  --cs: dark;
  --bg:#08090b;
  --bg-grad:#101318;
  --bg-soft:#0d0f12;
  --card:#131519;
  --card-2:#181b20;
  --border:rgba(255,255,255,.055);
  --border-soft:rgba(255,255,255,.03);
  --hover-border:rgba(255,255,255,.18);
  --row-hover-bg:rgba(255,255,255,.015);
  --overlay:rgba(255,255,255,.06);
  --scrollbar-thumb:rgba(255,255,255,.12);
  --outline-strong:rgba(255,255,255,.35);
  --shadow-color:rgba(0,0,0,.6);
  --text:#f2f3f5;
  --text-dim:#9297a1;
  --text-faint:#5a5e66;
  --blue:#3b82f6;
  --blue-dim:rgba(59,130,246,.14);
  --blue-text:#7fb0ff;
  --pos:#a78bfa;
  --pos-text:#c4b5fd;
  --pos-bg:rgba(167,139,250,.13);
  --pos-bg-strong:#1e1a35;
  --pos-border:rgba(167,139,250,.3);
  --red:#f8564f;
  --red-text:#f87171;
  --red-bg:rgba(248,86,79,.12);
  --red-bg-strong:#2a1414;
  --yellow:#eab308;
  --yellow-bg:rgba(234,179,8,.12);
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px var(--shadow-color);
  --input-focus-bg:#0f1319;
}
:root[data-theme="light"]{
  --cs: light;
  --bg:#f3f4f7;
  --bg-grad:#ffffff;
  --bg-soft:#ffffff;
  --card:#ffffff;
  --card-2:#f2f3f6;
  --border:rgba(15,23,42,.09);
  --border-soft:rgba(15,23,42,.06);
  --hover-border:rgba(15,23,42,.22);
  --row-hover-bg:rgba(15,23,42,.02);
  --overlay:rgba(15,23,42,.055);
  --scrollbar-thumb:rgba(15,23,42,.16);
  --outline-strong:rgba(15,23,42,.4);
  --shadow-color:rgba(15,23,42,.14);
  --text:#14161a;
  --text-dim:#5b6169;
  --text-faint:#9297a1;
  --blue:#2f6fed;
  --blue-dim:rgba(47,111,237,.1);
  --blue-text:#2f6fed;
  --pos:#7c3aed;
  --pos-text:#6d28d9;
  --pos-bg:rgba(124,58,237,.1);
  --pos-bg-strong:#f1ecfd;
  --pos-border:rgba(124,58,237,.28);
  --red:#dc2626;
  --red-text:#dc2626;
  --red-bg:rgba(220,38,38,.08);
  --red-bg-strong:#fdecec;
  --yellow:#b45309;
  --yellow-bg:rgba(180,83,9,.1);
  --shadow-card:0 1px 0 rgba(255,255,255,.6) inset, 0 8px 24px -12px var(--shadow-color);
  --input-focus-bg:#f5f8ff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;color-scheme:var(--cs, dark);}
@media (max-width:700px){
  /* evita que uma barra em branco apareça à direita ao fazer o gesto de pinça (zoom out) no celular */
  html,body{overflow-x:hidden;max-width:100vw;}
}
body{
  background:radial-gradient(1200px 600px at 50% -10%, var(--bg-grad) 0%, var(--bg) 55%) fixed;
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background-color .2s ease, color .2s ease;
}
.num,.stat-value,.money{ font-family:'Manrope',system-ui,sans-serif; }

#app{max-width:1600px;margin:0 auto;padding:0 14px 48px;}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:center;position:relative;
  padding:18px 4px 16px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 78%, transparent);
  backdrop-filter:blur(6px);
}
nav.tabs{
  display:flex;gap:4px;background:var(--card);border:1px solid var(--border);padding:5px;border-radius:999px;
  max-width:100%;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;cursor:grab;
  -webkit-user-select:none;user-select:none;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs.dragging{cursor:grabbing;}
nav.tabs button{
  appearance:none;border:none;background:transparent;color:var(--text-dim);
  font-family:'Inter';font-weight:600;font-size:14px;
  padding:12px 24px;border-radius:999px;cursor:pointer;
  transition:background .18s ease, color .18s ease;
  white-space:nowrap;
}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px -4px rgba(59,130,246,.55);}

.topbar-right{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:10px;
}
.save-pill{
  font-size:11px;color:var(--text-faint);display:flex;align-items:center;gap:6px;
  opacity:0;transition:opacity .25s ease;
}
.save-pill.show{opacity:1;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos);}

.tab-switcher{position:relative;}

/* ---------- mobile-only topbar: tap the active tab to open a picker for all tabs ---------- */
@media (max-width:700px){
  .topbar{justify-content:space-between;padding:14px 6px;gap:8px;}
  .topbar-right{position:static;transform:none;flex:0 0 auto;}
  .tab-switcher{flex:1 1 auto;min-width:0;}

  nav.tabs{padding:4px;border-radius:16px;}
  nav.tabs button{display:none;}
  nav.tabs button.active{
    display:flex;align-items:center;gap:8px;
    padding:11px 15px 11px 18px;cursor:pointer;
    border-radius:12px;
  }
  nav.tabs button.active::after{
    content:"";width:0;height:0;flex:0 0 auto;
    border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid currentColor;opacity:.85;
    transition:transform .2s ease;
  }
  nav.tabs.tabs-open{
    position:absolute;top:0;left:0;z-index:30;
    flex-direction:column;align-items:stretch;gap:2px;
    width:max-content;min-width:190px;max-width:min(80vw,320px);
    border-radius:16px;
    box-shadow:0 14px 32px -12px var(--shadow-color);
  }
  nav.tabs.tabs-open button{
    display:flex !important;
    justify-content:flex-start;text-align:left;
    padding:12px 16px;border-radius:12px;width:100%;
  }
  nav.tabs.tabs-open button.active::after{transform:rotate(180deg);}
}

/* ---------- generic ---------- */
.view{display:none;}
.view.active{display:block;animation:fadeUp .42s cubic-bezier(.16,1,.3,1);}
@keyframes fadeUp{
  0%{opacity:0;transform:translateY(16px) scale(.985);filter:blur(2px);}
  55%{opacity:1;filter:blur(0);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
}
.section-title{
  font-family:'Manrope';font-weight:800;font-size:12.5px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--text-dim);margin:0 0 18px;
}
.hint{font-size:12px;color:var(--text-faint);line-height:1.5;}

/* ---------- dashboard layout ---------- */
.dash-grid{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:stretch;margin-top:6px;}
.dash-grid>*{min-width:0;}
.dash-stats{display:flex;flex-direction:column;gap:8px;}
.stat-block{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:13px 16px;transition:background .18s ease, transform .15s ease;
  animation:fadeUp .4s ease both;
}
.stat-block:hover{background:var(--card-2);}
.stat-label{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-faint);font-weight:600;}
.stat-value{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-value.pos{color:var(--pos-text);}
.stat-value.neg{color:var(--red-text);}
.stat-value.blue{color:var(--blue-text);}
@media (max-width:860px){
  .dash-grid{grid-template-columns:1fr;}
  .dash-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
}
@media (max-width:480px){.dash-stats{grid-template-columns:repeat(2,minmax(0,1fr));}}

/* ---------- calendar ---------- */
.cal-card{padding:20px 22px 18px;position:relative;}
.cal-month-summary{
  position:absolute;top:20px;right:22px;text-align:right;
  background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:8px 13px;min-width:104px;
}
.cal-month-summary .stat-label{font-size:9px;}
.cal-month-summary .stat-value{font-size:16px;margin-top:3px;}
.cal-month-summary-pct{font-size:11px;font-weight:700;margin-top:2px;color:var(--text-dim);}
.cal-month-summary-pct.pos{color:var(--pos-text);}
.cal-month-summary-pct.neg{color:var(--red-text);}
@media (max-width:860px){
  .cal-month-summary{position:static;margin:0 0 12px auto;width:fit-content;max-width:100%;}
}
@media (max-width:700px){
  .cal-month-summary{
    margin:0 auto 12px;width:fit-content;max-width:100%;
    padding:5px 14px;min-width:0;
    display:flex;align-items:baseline;gap:8px;
    border-radius:999px;
  }
  .cal-month-summary .stat-label{display:none;}
  .cal-month-summary .stat-value{font-size:14px;margin-top:0;}
  .cal-month-summary-pct{font-size:11px;margin-top:0;}
}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 14px;}
.cal-arrow{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
  background:var(--card-2);color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s ease;font-size:14px;
}
.cal-arrow:hover{background:var(--blue);border-color:var(--blue);}
.cal-title{font-family:'Manrope';font-weight:800;font-size:15px;min-width:170px;text-align:center;text-transform:capitalize;}

.cal-toggle{display:flex;justify-content:center;margin-bottom:14px;}
.toggle-group{display:flex;background:var(--card-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.toggle-group button{
  appearance:none;border:none;background:transparent;color:var(--text-dim);
  font-family:'Inter';font-weight:700;font-size:12px;padding:8px 14px;border-radius:999px;cursor:pointer;
  transition:background .18s ease,color .18s ease;
  display:flex;align-items:center;justify-content:center;
}
.toggle-group button svg{width:15px;height:15px;display:block;}
.toggle-group button.active{background:var(--blue);color:#fff;}

.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.cal-dow{text-align:center;font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding-bottom:4px;}
.cal-cell{
  aspect-ratio:1/0.64;border-radius:10px;padding:7px 8px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--card-2);border:1px solid var(--border-soft);
  transition:transform .15s ease, box-shadow .15s ease;
  cursor:default;min-width:0;
}
.cal-cell.empty{background:transparent;border-color:transparent;}
.cal-cell.has-data{cursor:pointer;}
.cal-cell.has-data:hover{transform:translateY(-2px);}
.cal-cell.pos{background:var(--pos-bg-strong);border-color:var(--pos-border);}
.cal-cell.pos:hover{box-shadow:0 6px 18px -6px rgba(167,139,250,.35);}
.cal-cell.neg{background:var(--red-bg-strong);border-color:rgba(248,86,79,.28);}
.cal-cell.neg:hover{box-shadow:0 6px 18px -6px rgba(248,86,79,.35);}
.cal-daynum{font-size:12px;color:var(--text-dim);font-weight:600;}
.cal-cell.pos .cal-daynum{color:var(--pos-text);}
.cal-cell.neg .cal-daynum{color:var(--red-text);}
.cal-value{font-size:14px;font-weight:800;font-family:'Manrope';color:var(--text-dim);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;}
.cal-cell.pos .cal-value{color:var(--pos-text);}
.cal-cell.neg .cal-value{color:var(--red-text);}
@media (max-width:640px){
  .cal-cell{border-radius:8px;padding:5px 6px;}
  .cal-value{font-size:11px;}
  .cal-daynum{font-size:10px;}
}
@media (max-width:480px){
  .cal-card{padding:14px 12px 14px;}
  .cal-grid{gap:4px;}
  .cal-cell{aspect-ratio:1/0.82;padding:4px 3px;border-radius:7px;}
  .cal-value{font-size:9px;letter-spacing:-.2px;}
  .cal-daynum{font-size:9px;}
  .cal-dow{font-size:9px;padding-bottom:2px;}
  .cal-title{min-width:0;font-size:13px;}
  .cal-nav{gap:8px;}
  .cal-arrow{width:24px;height:24px;font-size:12px;}
}

.today-outline{outline:1.5px solid var(--outline-strong);outline-offset:-1.5px;}

/* ---------- monthly chart ---------- */
.chart-card{padding:20px 22px 22px;margin-top:16px;}
.monthly-chart-svg{width:100%;height:auto;display:block;overflow:visible;}
.chart-value-label{font-family:'Manrope';font-weight:700;font-size:11px;}
.chart-axis-label{font-family:'Inter';font-weight:600;font-size:10.5px;fill:var(--text-faint);text-transform:capitalize;}

/* ---------- ranking ---------- */
.ranking-card{padding:20px 22px 22px;margin-top:16px;}
.ranking-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px;}
@media (max-width:720px){.ranking-grid{grid-template-columns:1fr;}}
.ranking-subtitle{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;text-align:center;}
.ranking-subtitle.pos{color:var(--pos-text);}
.ranking-subtitle.neg{color:var(--red-text);}
.ranking-table{width:100%;border-collapse:collapse;}
.ranking-table tr{border-bottom:1px solid var(--border-soft);}
.ranking-table tr:last-child{border-bottom:none;}
.ranking-table td{padding:8px 4px;font-size:13px;}
.rk-pos{color:var(--text-faint);font-weight:700;width:32px;font-family:'Manrope';}
.rk-team{color:var(--text);font-weight:600;}
.rk-value{text-align:right;font-family:'Manrope';font-weight:800;letter-spacing:-.2px;}
.rk-value.pos{color:var(--pos-text);}
.rk-value.neg{color:var(--red-text);}
#ranking-toggle button{font-size:11.5px;padding:7px 16px;}

/* ---------- forms / tables ---------- */
.panel{padding:20px 22px;margin-bottom:18px;}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
input[type=number],input[type=date],input[type=time],input[type=text],input[type=email],input[type=password],select{
  background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;font-family:'Inter';
  outline:none;transition:border-color .15s ease, background .15s ease;
  width:100%;color-scheme:var(--cs);
}
input:focus,select:focus{border-color:var(--blue);background:var(--input-focus-bg);}
input::placeholder{color:var(--text-faint);}
select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239297a1' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 8px center;background-size:15px;padding-right:28px;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:.6;filter:none;background:transparent;}

.btn{
  appearance:none;border:none;border-radius:999px;cursor:pointer;font-family:'Inter';font-weight:700;
  font-size:13px;padding:10px 18px;transition:transform .1s ease, opacity .15s ease,box-shadow .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 16px -6px rgba(59,130,246,.6);}
.btn-primary:hover{opacity:.92;}
.btn-ghost{background:var(--card-2);color:var(--text-dim);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--hover-border);}
.btn-sm{padding:7px 13px;font-size:12px;}
.btn-danger{background:var(--red-bg);color:var(--red-text);border:1px solid rgba(248,86,79,.35);}
.btn-danger:hover{background:var(--red);color:#fff;}

.confirm-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;transition:opacity .15s ease;
}
.confirm-overlay.show{opacity:1;}
.confirm-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);width:100%;max-width:380px;padding:22px;
  transform:translateY(8px) scale(.98);transition:transform .15s ease;
}
.confirm-overlay.show .confirm-card{transform:translateY(0) scale(1);}
.confirm-title{font-family:'Manrope';font-weight:800;font-size:16px;color:var(--text);margin-bottom:8px;}
.confirm-msg{font-size:13px;color:var(--text-dim);line-height:1.5;margin-bottom:20px;}
.confirm-actions{display:flex;justify-content:flex-end;gap:10px;}

.table-wrap{
  overflow-x:auto;border-radius:var(--radius-lg);background:var(--card);box-shadow:var(--shadow-card);
  scrollbar-width:none;-ms-overflow-style:none;cursor:grab;-webkit-user-select:none;user-select:none;
}
.table-wrap::-webkit-scrollbar{display:none;}
.table-wrap.dragging{cursor:grabbing;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
#entradas-table{width:100%;min-width:1486px;}
#analises-table{width:100%;min-width:1510px;}
thead th{
  text-align:left;font-size:10.2px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);
  padding:12px 10px;font-weight:700;border-bottom:1px solid var(--border-soft);white-space:nowrap;
}
tbody td{padding:10px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
/* Células mais compactas em Entradas pra a tabela caber numa visualização só,
   sem precisar do scroll horizontal. Escopado só pra #entradas-table: Análises
   continua com o padding original (regra própria logo abaixo, inalterada). */
#entradas-table tbody td{padding:8px 6px;}
#analises-table tbody td{padding:10px 8px;}
#analises-table tbody td:first-child{padding-left:16px;}
#entradas-table tbody td:last-child,#analises-table tbody td:last-child{padding-right:16px;}
/* Coluna de ações de Análises (avião + excluir): padding-esquerda maior que o padrão
   pra dar um respiro visível entre o fim da coluna Leitura de mercado e o avião,
   equivalente ao espaço dado à coluna de excluir em Entradas. */
#analises-table tbody td:last-child{padding-left:16px;}
#analises-table thead th:first-child{padding-left:16px;}
#entradas-table thead th:last-child,#analises-table thead th:last-child{padding-right:16px;}
/* Data é a 1ª coluna em Entradas. O padding não é simétrico (10/6) de propósito:
   a 2ª coluna (Campeonato) tem padding-left:8px próprio, então um padding simétrico
   aqui deixava o botão de data visivelmente puxado pra esquerda (mais espaço sobrando
   do lado direito, antes do campo Campeonato, do que do lado esquerdo, antes da borda
   da tabela). Somando esse 8px do vizinho, 10/6 fica com os dois vãos praticamente
   iguais e o botão centralizado no bloco visual da coluna. A coluna e o padding interno
   do botão (abaixo) foram enxugados pra caber tudo sem scroll horizontal em 100% de
   zoom numa tela de notebook comum, sem herdar largura do texto "DD/MM". */
#entradas-table tbody td:first-child,#entradas-table thead th:first-child{padding-left:10px;padding-right:6px;}
/* Mesma lógica acima, mas pra coluna Data de Análises (3ª coluna), que não tem
   padding padrão diferenciado (era 10px 8px, herdado de #analises-table tbody td). */
#analises-table tbody td:nth-child(2){padding-left:6px;padding-right:6px;}
tbody tr{transition:background .12s ease;}
tbody tr:hover{background:var(--row-hover-bg);}
tbody tr:last-child td{border-bottom:none;}
td input,td select{padding:7px 9px;font-size:13px;width:100%;min-width:0;}
/* Inputs mais compactos em Entradas, mesma lógica acima (exceto Stake/Retorno/Odd,
   que já têm padding próprio em .calc.bare-input / .odd-input.calc). */
#entradas-table td input:not(.bare-input):not(.odd-input),#entradas-table td select{padding:7px 7px;}
#analises-table td input,#analises-table td select{padding:7px 6px;}
td input[type=date],td input[type=time]{padding:6px 4px;font-size:13px;min-width:86px;}
/* Aba Análises: todos os campos usam a mesma fonte (13px), sem exceção. As colunas
   foram redimensionadas (com aumento na largura total da tabela) para que Hora, Data,
   Campeonato, Mandante e Visitante caibam por completo com esse tamanho de fonte,
   tomando como base o nome de time e de campeonato mais longos cadastrados (ex.:
   "CONMEBOL Sudamericana", "Olympique de Marseille"), mantendo Superioridade no jogo
   larga o bastante para mostrar o texto completo. */
#analises-table td input[type="time"]{min-width:52px;padding:6px 2px;font-size:13px;text-align:center;}
#analises-table td input[type="time"]::-webkit-calendar-picker-indicator{display:none;-webkit-appearance:none;margin:0;}
#analises-table td input[type="date"]{min-width:96px;padding:6px 3px;font-size:13px;text-align:center;}
#analises-table td select[data-field="leitura"],#an-leitura{
  font-size:13px;padding:7px 26px 7px 9px;
}
#analises-table td select[data-field="sup"],#an-sup{
  font-size:13px;padding:7px 28px 7px 9px;
}


.calc{font-family:'Manrope';font-weight:700;font-size:13px;white-space:nowrap;color:var(--text);}
.calc.pos{color:var(--pos-text);}
.calc.neg{color:var(--red-text);}
#entradas-table th,#analises-table th{text-align:center;}
#entradas-table td:nth-child(6),#entradas-table td:nth-child(7),#entradas-table td:nth-child(8),#entradas-table td:nth-child(9){text-align:center;}
.calc.bare-input{
  appearance:none;-webkit-appearance:none;-moz-appearance:textfield;
  background:transparent;border:none;padding:0;width:100%;text-align:center;
}
.calc.bare-input:focus{background:transparent;border:none;}
.calc.bare-input::-webkit-outer-spin-button,.calc.bare-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.odd-input{max-width:80px;}
.odd-input.calc{
  appearance:none;-webkit-appearance:none;-moz-appearance:textfield;
  background:transparent;border:none;padding:0;width:100%;
  font-family:'Manrope';font-weight:700;font-size:13px;text-align:center;
}
.odd-input.calc:focus{background:transparent;border:none;}
.odd-input.calc:hover{cursor:text;}
.odd-input.calc::-webkit-outer-spin-button,.odd-input.calc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.del-btn{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);
  color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;font-size:14px;
}
.del-btn:hover{background:var(--red-bg);color:var(--red-text);border-color:rgba(248,86,79,.35);}

.row-actions{display:flex;align-items:center;justify-content:flex-start;gap:6px;}
.send-btn{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);
  color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.send-btn svg{transform:scaleX(-1);transition:transform .15s ease;}
.send-btn:hover{background:var(--blue-dim);color:var(--blue);border-color:rgba(70,130,255,.35);}
.send-btn:hover svg{transform:scaleX(-1) translate(-1px,-1px);}
.send-btn.sent{background:var(--blue-dim);color:var(--blue);border-color:rgba(70,130,255,.35);}

.icon-add-btn{
  appearance:none;border:none;background:transparent;color:var(--text-faint);
  width:28px;height:28px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;font-weight:500;font-family:'Inter';
  transition:all .15s ease;
}
.icon-add-btn:hover{color:var(--blue);background:var(--blue-dim);}
.icon-add-btn:active{transform:scale(.92);}

.add-row-form td{background:var(--bg-soft);padding-top:12px;padding-bottom:12px;}
.add-row-form{position:relative;}

/* ---------- tabelas em cards no mobile (entradas & análises) ---------- */
/* No desktop a tabela rola na horizontal; no mobile isso força colunas
   estreitas (ex.: Campeonato/Data) a se sobreporem/comprimirem de forma
   ilegível. Abaixo de 720px cada linha vira um card com campo empilhado
   sobre campo, na mesma ordem do cabeçalho (Data sempre antes de Campeonato). */
@media (max-width:720px){
  .table-wrap{overflow-x:visible;cursor:default;background:transparent;box-shadow:none;border-radius:0;}
  #entradas-table,#analises-table{width:100%;min-width:0;table-layout:auto;}
  #entradas-table colgroup,#analises-table colgroup{display:none;}
  #entradas-table thead,#analises-table thead{
    position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px;
  }
  #entradas-table tbody,#entradas-table tr,
  #analises-table tbody,#analises-table tr{display:block;width:100%;}
  #entradas-table tbody tr[data-id],#entradas-table tbody tr.add-row-form,
  #analises-table tbody tr[data-id],#analises-table tbody tr.add-row-form{
    background:var(--card-2);border:1px solid var(--border-soft);border-radius:var(--radius-md);
    padding:10px 14px 4px;margin-bottom:10px;
  }
  #entradas-table tbody tr.add-row-form,#analises-table tbody tr.add-row-form{
    background:var(--bg-soft);border-style:dashed;
  }
  #entradas-table td,#analises-table td{
    display:flex;flex-direction:column;align-items:flex-start;gap:4px;
    width:100%;padding:7px 0;border-bottom:1px solid var(--border-soft);text-align:left;
  }
  .date-cell-btn{text-align:left;}
  #entradas-table td:last-child,#analises-table td:last-child{border-bottom:none;}
  #entradas-table td[data-label]:not([data-label=""])::before,
  #analises-table td[data-label]:not([data-label=""])::before{
    content:attr(data-label);font-size:10px;text-transform:uppercase;letter-spacing:.5px;
    font-weight:700;color:var(--text-faint);
  }
  #entradas-table td input,#entradas-table td select,
  #analises-table td input,#analises-table td select{width:100%;text-align:left;}
  #entradas-table td[data-label=""],#analises-table td[data-label=""]{
    flex-direction:row;justify-content:flex-end;border-bottom:none;padding-top:6px;
  }
  #entradas-table td.calc,#analises-table td.calc{
    flex-direction:row;justify-content:space-between;align-items:center;
  }
  #entradas-table td:nth-child(6),#entradas-table td:nth-child(7),
  #entradas-table td:nth-child(8),#entradas-table td:nth-child(9){text-align:left;}
}

.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.tag-blue{background:var(--blue-dim);color:var(--blue-text);}
.tag-red{background:var(--red-bg);color:var(--red-text);}
.tag-yellow{background:var(--yellow-bg);color:var(--yellow);}
.tag-gray{background:var(--card-2);color:var(--text-faint);border:1px solid var(--border);}
.tag-pos{background:var(--pos-bg);color:var(--pos-text);}

.search-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:12px 14px;margin-bottom:16px;
}
.search-bar .search-input-wrap{position:relative;flex:1;min-width:180px;}
.search-bar .search-input-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;}
.search-bar input[type=text]{padding-left:32px;}
.search-toggles{display:flex;gap:6px;}
.search-toggle{
  appearance:none;border:1px solid var(--border);background:var(--card-2);color:var(--text-dim);
  font-family:'Inter';font-weight:700;font-size:12px;padding:8px 14px;border-radius:999px;cursor:pointer;
  transition:all .15s ease;white-space:nowrap;
}
.search-toggle:hover{color:var(--text);border-color:var(--hover-border);}
.search-toggle.active{background:var(--blue);color:#fff;border-color:var(--blue);}

.date-filter-icon-btn{
  appearance:none;border:1px solid var(--border);background:var(--card-2);color:var(--text-dim);
  width:34px;height:34px;min-width:34px;border-radius:var(--radius-md);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;position:relative;
}
.date-filter-icon-btn:hover{color:var(--text);border-color:var(--hover-border);}
.date-filter-icon-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.date-filter-wrap{position:relative;display:inline-flex;}

/* Calendario proprio (sem input type=date nativo), para nao depender do seletor
   do sistema operacional, que no Safari/iOS se mostrou instavel quando aberto via
   JavaScript/overlay. Aqui todo o toque e um clique comum em botao, controlado
   inteiramente por nos. */
.mini-cal-popover{
  position:absolute;top:calc(100% + 6px);left:0;z-index:50;width:246px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:0 10px 28px rgba(0,0,0,.28);padding:10px;
}
.mini-cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;}
.mini-cal-label{font-family:'Inter';font-weight:700;font-size:12px;color:var(--text);text-transform:capitalize;}
.mini-cal-nav{
  appearance:none;border:1px solid var(--border);background:var(--card-2);color:var(--text-dim);
  width:26px;height:26px;min-width:26px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;
}
.mini-cal-nav:hover{color:var(--text);border-color:var(--hover-border);}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.mini-cal-dow{font-family:'Inter';font-weight:700;font-size:10px;color:var(--text-dim);text-align:center;padding:4px 0;}
.mini-cal-day{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--text);
  font-family:'Inter';font-size:12px;padding:7px 0;border-radius:8px;cursor:pointer;text-align:center;
}
.mini-cal-day:hover{background:var(--card-2);}
.mini-cal-day-muted{visibility:hidden;pointer-events:none;}
.mini-cal-day-today{border-color:var(--blue);}
.mini-cal-day-selected{background:var(--blue);color:#fff;}
.mini-cal-footer{margin-top:8px;text-align:center;}
.mini-cal-today-link{
  appearance:none;border:0;background:transparent;color:var(--blue);font-family:'Inter';
  font-weight:700;font-size:11px;cursor:pointer;padding:4px;
}

/* Botão compacto de data por linha (coluna Data de Entradas/Análises), que abre o
   mesmo mini-calendário usado no filtro do topo. Substitui o input type="date"
   nativo dentro da célula da tabela, mostrando só "DD/MM" pra economizar espaço.
   Mantém a mesma "caixa" (borda e fundo) dos outros campos da linha, sem
   negrito, só centralizado. */
.date-cell-wrap{position:relative;display:block;width:100%;}
/* A coluna Data fica dentro do .table-wrap com scroll horizontal, que por padrão
   recorta (clip) qualquer conteúdo posicionado fora da área visível. Enquanto um
   mini-calendário de linha está aberto, soltamos esse recorte para o popover não
   ser cortado nas linhas de baixo ou nas colunas mais à direita. */
.table-wrap.rowcal-open{overflow:visible;}
.date-cell-btn{
  appearance:none;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);
  font-family:'Inter';font-weight:400;font-size:13px;padding:7px 9px;border-radius:var(--radius-sm);cursor:pointer;
  transition:border-color .15s ease;white-space:nowrap;text-align:center;width:100%;
}
/* Padding interno do botão de data enxugado nas duas tabelas (era 7px 12px em
   Entradas e o padrão 7px 9px em Análises) pra caber dentro da coluna Data mais
   estreita sem o texto "DD/MM" estourar a caixa do botão, sem precisar reduzir
   o font-size (13px, inalterado). */
#entradas-table .date-cell-btn{padding:7px 6px;}
#analises-table .date-cell-btn{padding:7px 6px;}
.date-cell-btn:hover{border-color:var(--hover-border);}
.date-cell-btn:focus{border-color:var(--blue);}
/* Abre ao lado (à direita) da célula, em vez de embaixo centralizado: a coluna
   Data costuma ficar perto da borda esquerda da tabela, e um popover largo
   centralizado embaixo acaba saindo da área visível do scroll horizontal,
   impedindo selecionar datas do lado esquerdo do calendário. */
.date-cell-wrap .mini-cal-popover{top:0;left:calc(100% + 8px);right:auto;}

@media (max-width:700px){
  /* mantém ancorado à esquerda do botão (não à direita), senão o painel,
     que é mais largo que o próprio botão, é empurrado para fora da tela
     à esquerda e fica invisível. Só limita a largura para não estourar
     a borda direita em telas bem estreitas. */
  .mini-cal-popover{left:0;right:auto;width:min(246px, calc(100vw - 32px));}
  /* No mobile a tabela vira cards empilhados (linha ocupa a largura toda), então
     não há "lado" pra abrir — volta a abrir embaixo, ancorado à esquerda. */
  .date-cell-wrap .mini-cal-popover{top:calc(100% + 6px);left:0;}
}
.today-btn{
  appearance:none;border:1px solid var(--border);background:var(--card-2);color:var(--text-dim);
  font-family:'Inter';font-weight:700;font-size:12px;padding:8px 14px;border-radius:999px;cursor:pointer;
  transition:all .15s ease;white-space:nowrap;
}
.today-btn:hover{color:var(--text);border-color:var(--hover-border);}
.today-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}


.filter-banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--blue-dim);border:1px solid rgba(59,130,246,.3);color:var(--blue-text);
  padding:11px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:600;margin-bottom:16px;
}
.filter-banner button{background:none;border:none;color:var(--blue-text);text-decoration:underline;cursor:pointer;font-size:12.5px;font-weight:600;}

.empty-state{padding:36px 20px;text-align:center;color:var(--text-faint);font-size:13.5px;}

/* config chips */
.chip-search{margin-bottom:12px;}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px;}
.chip{
  display:flex;align-items:center;gap:8px;background:var(--card-2);border:1px solid var(--border);
  padding:7px 8px 7px 13px;border-radius:999px;font-size:12.5px;color:var(--text-dim);
}
.chip button{
  width:18px;height:18px;border-radius:50%;border:none;background:var(--overlay);color:var(--text-faint);
  cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.chip button:hover{background:var(--red-bg);color:var(--red-text);}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:760px){.config-grid{grid-template-columns:1fr;}}
.add-inline{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.add-inline input{flex:1;}

.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.clear-all-btn{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:none;padding:0;margin:0;
  background:var(--overlay);color:var(--text-faint);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;
}
.clear-all-btn:hover{background:var(--red-bg);color:var(--red-text);}

.checkbox{width:17px;height:17px;accent-color:var(--pos);cursor:pointer;}

.loading-screen{padding-top:18px;}
.spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--blue);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- skeleton (loading por card) ---------- */
.skel-card{position:relative;overflow:hidden;min-height:220px;}
.skel-card.skel-cal{min-height:360px;}
.skel-card.skel-chart{min-height:200px;margin-top:16px;}
.skel-card.skel-ranking{min-height:200px;margin-top:16px;}
.stat-block.skel{position:relative;overflow:hidden;}
.skel-line{background:var(--overlay);border-radius:6px;}
.skel-line.skel-label{width:44%;height:9px;}
.skel-line.skel-value{width:72%;height:17px;margin-top:10px;}
.skel-card::after,.stat-block.skel::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
  transform:translateX(-100%);animation:skel-shimmer 1.5s ease-in-out infinite;
}
@keyframes skel-shimmer{100%{transform:translateX(100%);}}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--card-2);border:1px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:600;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- foco consistente (teclado) ---------- */
/* Botões e controles não tinham nenhum :focus próprio, então caíam no
   outline quadrado padrão do navegador, destoando do resto (tudo arredondado,
   com --blue como cor de destaque). Usa :focus-visible pra não aparecer em
   cliques de mouse, só em navegação por teclado. */
button:focus-visible,.date-cell-btn:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px;
}
.chip button:focus-visible,.clear-all-btn:focus-visible,.del-btn:focus-visible,
.send-btn:focus-visible,.icon-add-btn:focus-visible,.cal-arrow:focus-visible,
.theme-toggle:focus-visible{outline-offset:1px;}

::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- auth screen ---------- */
.auth-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.auth-card{
  width:100%;max-width:340px;padding:28px 26px 26px;display:flex;flex-direction:column;gap:12px;
  animation:fadeUp .42s cubic-bezier(.16,1,.3,1);
}
#auth-form{display:flex;flex-direction:column;gap:12px;margin:0;}
.auth-logo{font-family:'Manrope';font-weight:800;font-size:18px;text-align:center;margin-bottom:4px;}
.auth-card .btn-primary{width:100%;padding:11px 18px;margin-top:4px;}
.auth-error{font-size:12px;color:var(--red-text);min-height:15px;}
.auth-switch{font-size:12.5px;color:var(--text-faint);text-align:center;margin-top:6px;}
.auth-switch button{
  appearance:none;border:none;background:transparent;color:var(--blue-text);font-weight:700;cursor:pointer;font-size:12.5px;
  padding:0 0 0 4px;font-family:'Inter';
}
.auth-switch button:hover{text-decoration:underline;}
.logout-btn{

  border-radius:999px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:6px;margin-left:8px;transition:all .15s ease;
}
.logout-btn:hover{color:var(--text);border-color:var(--hover-border);}

.theme-toggle{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card-2);
  color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;

.theme-toggle:hover{color:var(--text);border-color:var(--hover-border);}
.theme-toggle svg{width:16px;height:16px;display:block;}
.theme-toggle .icon-moon{display:block;}
.theme-toggle .icon-sun{display:none;}
:root[data-theme="light"] .theme-toggle .icon-moon{display:none;}
:root[data-theme="light"] .theme-toggle .icon-sun{display:block;}

/* A lib do Supabase usa por padrão a Web Locks API do navegador (navigator.locks) para

let authLockChain = Promise.resolve();
function simpleAuthLock(name, acquireTimeout, fn){
  const run = () => Promise.resolve().then(fn);
  const result = authLockChain.then(run, run);
  authLockChain = result.then(()=>{}, ()=>{});

/* ================= INATIVIDADE (logout automático) ================= */
const INACTIVITY_LIMIT_MS = 30 * 60 * 1000; // 30 minutos

const ACTIVITY_EVENTS = ["mousedown","keydown","scroll","touchstart"];
let inactivityInterval = null;
let inactivityLogoutPending = false;

function markActivity(){
  try{ window.localStorage.setItem(LAST_ACTIVITY_KEY, String(Date.now())); }catch(e){}
}
function getLastActivity(){
  const v = window.localStorage.getItem(LAST_ACTIVITY_KEY);
  const n = v ? parseInt(v,10) : NaN;
  return Number.isFinite(n) ? n : Date.now();
}
async function checkInactivity(){
  if(!currentUser) return;
  if(Date.now() - getLastActivity() >= INACTIVITY_LIMIT_MS){
    inactivityLogoutPending = true;
    await supabase.auth.signOut();
  }
}
function startActivityTracking(){
  markActivity();
  ACTIVITY_EVENTS.forEach(evt => document.addEventListener(evt, markActivity, { passive:true }));
  document.addEventListener("visibilitychange", onVisibilityChangeCheck);
  clearInterval(inactivityInterval);
  inactivityInterval = setInterval(checkInactivity, 30000); // confere a cada 30s
}
function stopActivityTracking(){
  ACTIVITY_EVENTS.forEach(evt => document.removeEventListener(evt, markActivity));
  document.removeEventListener("visibilitychange", onVisibilityChangeCheck);
  clearInterval(inactivityInterval);
  inactivityInterval = null;
}
function onVisibilityChangeCheck(){
  if(document.visibilityState === "visible") checkInactivity();
}

let state = null;

/* ================= STORAGE (Supabase) ================= */
let applyingRemote = false; // evita salvar de volta o que acabou de chegar via realtime

function repairOrphanChecks(s){
  // corrige análises cujo lançamento vinculado em Entradas não existe mais
  // (ex: entrada apagada manualmente na aba Entradas): desmarca o check
  if(!s || !Array.isArray(s.analyses) || !Array.isArray(s.bets)) return s;
  const betIds = new Set(s.bets.map(b=>b.id));
  s.analyses.forEach(a=>{
    if(a.linkedBetId && !betIds.has(a.linkedBetId)){
      a.checked = false;
      a.linkedBetId = null;
    }
  });
  return s;
}

async function loadState(){
  try{
    const { data, error } = await supabase
      .from("app_state")
      .select("data")
      .eq("user_id", currentUser.id)
      .maybeSingle();
    if(error) throw error;
    if(data && data.data){
      return repairOrphanChecks(Object.assign(defaultState(), data.data));
    }
  }catch(e){ console.error("Falha ao carregar:", e); showToast("Erro ao carregar dados"); }
  return defaultState();
}

let saveTimer = null;
function persist(){
  if(applyingRemote) return; // não reenviar dados que acabaram de chegar de outro aparelho
  showSavePill();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      const { error } = await supabase
        .from("app_state")
        .upsert({ user_id: currentUser.id, data: state, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
      if(error) throw error;
    }catch(e){ console.error("Falha ao salvar:", e); showToast("Erro ao salvar - verifique a conexão"); }
  }, 350);
}

function subscribeRealtime(){
  if(realtimeChannel) supabase.removeChannel(realtimeChannel);
  realtimeChannel = supabase
    .channel("app_state_changes_" + currentUser.id)
    .on("postgres_changes",
      { event: "UPDATE", schema: "public", table: "app_state", filter: `user_id=eq.${currentUser.id}` },
      (payload) => {
        applyingRemote = true;
        state = repairOrphanChecks(Object.assign(defaultState(), payload.new.data));
        renderTabs();
        applyingRemote = false;
      }
    )
    .subscribe();
}

/* ================= AUTH ================= */
function showAuthScreen(mode, message){
  document.getElementById("auth-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
  setAuthMode(mode || "login");
  if(message) document.getElementById("auth-error").textContent = message;
}
function hideAuthScreen(){
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").style.display = "";
}
let authMode = "login";
function setAuthMode(mode){
  authMode = mode;
  document.getElementById("auth-error").textContent = "";
  document.getElementById("auth-title").textContent = mode==="login" ? "Entrar" : "Criar conta";
  document.getElementById("auth-submit").textContent = mode==="login" ? "Entrar" : "Criar conta";
  document.getElementById("auth-switch-text").textContent = mode==="login" ? "Não tem conta?" : "Já tem conta?";
  document.getElementById("auth-switch-btn").textContent = mode==="login" ? "Criar conta" : "Entrar";
}
async function handleAuthSubmit(){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const errEl = document.getElementById("auth-error");
  errEl.textContent = "";
  if(!email || !password){ errEl.textContent = "Preencha email e senha."; return; }
  const btn = document.getElementById("auth-submit");
  btn.disabled = true;
  try{
    if(authMode==="login"){
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if(error) throw error;
    } else {
      const { error } = await supabase.auth.signUp({ email, password });
      if(error) throw error;
      errEl.style.color = "var(--pos-text)";
      errEl.textContent = "Conta criada! Enviamos um email de confirmação — abra sua caixa de entrada (e o spam), clique no link e depois volte aqui para entrar.";
      setAuthMode("login");
      btn.disabled = false;
      return;
    }
  }catch(e){
    errEl.style.color = "";
    errEl.textContent = traduzErroAuth(e.message);
    btn.disabled = false;
  }
}
function traduzErroAuth(msg){
  if(/invalid login credentials/i.test(msg)) return "Email ou senha incorretos.";
  if(/email not confirmed/i.test(msg)) return "Você ainda não confirmou seu email. Verifique sua caixa de entrada (e o spam) e clique no link de confirmação antes de entrar.";
  if(/already registered|already exists/i.test(msg)) return "Este email já tem uma conta.";
  if(/password.*least/i.test(msg)) return "A senha precisa ter pelo menos 6 caracteres.";
  return msg;
}
async function signOut(){
  await supabase.auth.signOut();
}
function showSavePill(){
  const el = document.getElementById("save-pill");
  if(!el) return;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("show"), 1200);
}
function showToast(msg){
  const el = document.getElementById("toast");
  if(!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("show"), 1800);
}

/* ================= CONFIRMAÇÃO (modal genérico) ================= */
function showConfirmModal({title, message, confirmLabel="Confirmar", onConfirm}){
  const existing = document.getElementById("confirm-overlay");
  if(existing) existing.remove();

  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.id = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-card">
      <div class="confirm-title">${escapeHtml(title)}</div>
      <div class="confirm-msg">${escapeHtml(message)}</div>
      <div class="confirm-actions">
        <button class="btn btn-ghost btn-sm" id="confirm-cancel-btn">Cancelar</button>
        <button class="btn btn-danger btn-sm" id="confirm-ok-btn">${escapeHtml(confirmLabel)}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add("show"));

  const close = ()=>{
    overlay.classList.remove("show");
    setTimeout(()=>overlay.remove(), 150);
    document.removeEventListener("keydown", onKeydown);
  };
  const onKeydown = (e)=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKeydown);

  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector("#confirm-cancel-btn").addEventListener("click", close);
  overlay.querySelector("#confirm-ok-btn").addEventListener("click", ()=>{
    close();
    onConfirm();
  });
}

/* ================= UNDO (Ctrl+Z) ================= */
function snapshotForUndo(){
  undoStack.push(JSON.stringify(state));
  if(undoStack.length>25) undoStack.shift();
}
function undo(){
  if(undoStack.length===0){ showToast("Nada para desfazer"); return; }
  const snap = undoStack.pop();
  state = JSON.parse(snap);
  persist();
  renderTabs();
  showToast("Ação desfeita");
}
document.addEventListener("keydown", (e)=>{
  const key = (e.key||"").toLowerCase();
  if((e.ctrlKey||e.metaKey) && key==="z" && !e.shiftKey){
    const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
    const isEditable = tag==="input"||tag==="select"||tag==="textarea";
    if(!isEditable){
      e.preventDefault();
      undo();
    }
    return;
  }
  if(e.key === "Escape"){
    handleEscapeKey();
    return;
  }
  if(e.key === "Enter"){
    handleEnterKey(e);
  }
});

// Esc: fecha calendários/menu abertos e cancela o foco do campo em edição
// (sem salvar uma alteração que ainda não tenha sido confirmada).
function handleEscapeKey(){
  if(entradasCalendarOpen){
    entradasCalendarOpen = false;
    if(currentTab==="entradas" && document.getElementById("entradas-date-btn")) renderEntradas();
  }
  if(analisesCalendarOpen){
    analisesCalendarOpen = false;
    if(currentTab==="analises" && document.getElementById("analises-date-btn")) renderAnalises();
  }
  if(rowDatePicker){
    const scope = rowDatePicker.scope;
    rowDatePicker = null;
    if(scope==="entradas" && currentTab==="entradas" && document.getElementById("bets-tbody")) renderEntradas();
    if(scope==="analises" && currentTab==="analises" && document.getElementById("an-tbody")) renderAnalises();
  }
  const navEl = document.getElementById("tabs");
  if(navEl && navEl.classList.contains("tabs-open")) navEl.classList.remove("tabs-open");
  const active = document.activeElement;
  if(active && (active.tagName==="INPUT"||active.tagName==="SELECT"||active.tagName==="TEXTAREA")){
    active.blur();
  }
}

// Enter: dentro da linha de "adicionar", envia o lançamento/análise (igual ao botão "+").
// Em um campo de uma linha já existente, confirma a edição (dispara o "change") e tira o foco.
function handleEnterKey(e){
  const active = document.activeElement;
  if(!active) return;
  const tag = active.tagName;
  if(tag!=="INPUT" && tag!=="SELECT") return;

  const addRowEntrada = active.closest && active.closest("#add-row-entrada");
  if(addRowEntrada){
    e.preventDefault();
    const btn = document.getElementById("add-bet");
    if(btn) btn.click();
    return;
  }
  const addRowAnalise = active.closest && active.closest("#add-row-analise");
  if(addRowAnalise){
    e.preventDefault();
    const btn = document.getElementById("add-an");
    if(btn) btn.click();
    return;
  }
  if(active.dataset && active.dataset.field){
    e.preventDefault();
    active.blur();
  }
}

/* ================= HELPERS ================= */
function fmtBRL(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function fmtBRLCalMobile(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return Math.round(n).toLocaleString("pt-BR");
}
function isMobileViewport(){
  return typeof window!=="undefined" && window.matchMedia && window.matchMedia("(max-width:640px)").matches;
}
function isNarrowScreen(){
  return typeof window!=="undefined" && window.matchMedia && window.matchMedia("(max-width:700px)").matches;
}
function parseBRL(str){
  if(str===undefined||str===null) return 0;
  let s = String(str).trim().replace(/R\$\s?/gi,"").replace(/[^\d,.-]/g,"");
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return (n*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%";
}
function fmtNum(n,d){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtOdd(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return Number(n).toFixed(2);
}
function betCalc(b){
  const stake = Number(b.stake)||0;
  const retorno = Number(b.retorno)||0;
  // Regra: se o retorno for 0 ou menor que a stake, a odd NÃO é calculada automaticamente.
  const autoOdd = stake>0 && retorno>0 && retorno>=stake;
  let odd = null;
  if(autoOdd) odd = retorno/stake;
  else if(b.oddManual!==undefined && b.oddManual!==null && b.oddManual!=="") odd = Number(b.oddManual);
  const profit = stake>0 ? (retorno-stake) : 0;
  const profitUnits = (stake>0 && state.stakeUnit>0) ? profit/state.stakeUnit : 0;
  return {odd, autoOdd, profit, profitUnits};
}
function computeStats(){
  let profitTotal=0, unitsTotal=0, oddSum=0, oddCount=0, apostado=0, wins=0, decided=0;
  state.bets.forEach(b=>{
    const c = betCalc(b);
    profitTotal += c.profit;
    unitsTotal += c.profitUnits;
    apostado += Number(b.stake)||0;
    if(c.odd!==null){ oddSum+=c.odd; oddCount++; }
    if(Number(b.stake)>0){
      decided++;
      if(c.profit>0) wins++;
    }
  });
  const atual = state.bankrollInicial + profitTotal;
  const roi = apostado>0 ? profitTotal/apostado : 0;
  const taxaAcerto = decided>0 ? wins/decided : 0;
  return {
    inicio: state.bankrollInicial,
    atual,
    oddMedia: oddCount? oddSum/oddCount : 0,
    stake: state.stakeUnit,
    lucroUnidades: unitsTotal,
    lucroReais: profitTotal,
    apostado,
    roi,
    taxaAcerto
  };
}
function dailyProfit(iso){
  return state.bets.filter(b=>b.date===iso).reduce((s,b)=>s+betCalc(b).profit,0);
}
function bankrollBeforeDate(iso){
  const profitAntes = state.bets
    .filter(b=>b.date<iso)
    .reduce((s,b)=>s+betCalc(b).profit,0);
  return state.bankrollInicial + profitAntes;
}
function monthStats(y,m){
  const prefix = `${y}-${pad2(m+1)}-`;
  let profit=0, count=0;
  state.bets.forEach(b=>{
    if(b.date && b.date.startsWith(prefix)){ profit += betCalc(b).profit; count++; }
  });
  const banca = bankrollBeforeDate(isoDate(y,m,1));
  const pct = banca>0 ? profit/banca : 0;
  return {profit, pct, count};
}
function monthlyPerformance(){
  const map = {};
  state.bets.forEach(b=>{
    if(!b.date) return;
    const key = b.date.slice(0,7); // YYYY-MM
    map[key] = (map[key]||0) + betCalc(b).profit;
  });
  const keys = Object.keys(map).sort();
  return keys.map(key=>{
    const [y,m] = key.split("-").map(Number);
    return { key, label: `${MONTHS[m-1].slice(0,3)}/${String(y).slice(2)}`, profit: map[key] };
  });
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function teamInPick(pickText){
  if(!pickText) return null;
  const text = pickText.toLowerCase();
  const sorted = [...state.clubs].sort((a,b)=>b.length-a.length);
  for(const c of sorted){
    const re = new RegExp(`(^|[^a-zà-ÿ0-9])${escapeRegex(c.toLowerCase())}([^a-zà-ÿ0-9]|$)`, "i");
    if(re.test(text)) return c;
  }
  return null;
}
function teamRanking(scope){
  const map = {};
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const prefix = `${y}-${pad2(m+1)}-`;
  state.bets.forEach(b=>{
    if(scope==="month" && !(b.date && b.date.startsWith(prefix))) return;
    const team = teamInPick(b.pick);
    if(!team) return;
    map[team] = (map[team]||0) + betCalc(b).profit;
  });
  const arr = Object.entries(map).map(([team,profit])=>({team,profit}));
  const sortedDesc = [...arr].sort((a,b)=>b.profit-a.profit);
  const top10 = sortedDesc.filter(x=>x.profit>0).slice(0,10);
  const bottom10 = sortedDesc.filter(x=>x.profit<0).slice(-10).reverse();
  return {top10, bottom10};
}
function resolveRegistered(list, value){
  const v = (value||"").trim();
  if(v==="") return "";
  const match = list.find(x=>x.toLowerCase()===v.toLowerCase());
  return match || null;
}
function validateTeamFields(data){
  if(data.champ){
    const matched = resolveRegistered(state.championships, data.champ);
    if(matched===null) return {ok:false, field:"champ", msg:`O campeonato "${data.champ}" não está cadastrado.`};
    data.champ = matched;
  }
  if(data.home){
    const matched = resolveRegistered(state.clubs, data.home);
    if(matched===null) return {ok:false, field:"home", msg:`O clube "${data.home}" não está cadastrado.`};
    data.home = matched;
  }
  if(data.away){
    const matched = resolveRegistered(state.clubs, data.away);
    if(matched===null) return {ok:false, field:"away", msg:`O clube "${data.away}" não está cadastrado.`};
    data.away = matched;
  }
  return {ok:true};
}
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayIso(){ const t=new Date(); return isoDate(t.getFullYear(),t.getMonth(),t.getDate()); }

/* ================= MINI CALENDARIO (proprio, sem input type=date nativo) ================= */
function buildCalendarCells(year, month){
  // month e 0-indexado (0=janeiro)
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push({day:d, iso: isoDate(year, month, d)});
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function renderMiniCalendarHtml(idPrefix, viewY, viewM, selectedIso){
  const cells = buildCalendarCells(viewY, viewM);
  const todayStr = todayIso();
  let dowRow = DOW.map(d=>`<div class="mini-cal-dow">${d}</div>`).join("");
  let dayCells = cells.map(c=>{
    if(!c) return `<div class="mini-cal-day mini-cal-day-muted">.</div>`;
    const isSel = c.iso===selectedIso;
    const isToday = c.iso===todayStr;
    return `<button type="button" class="mini-cal-day ${isSel?'mini-cal-day-selected':''} ${isToday?'mini-cal-day-today':''}" data-iso="${c.iso}">${c.day}</button>`;
  }).join("");
  return `
    <div class="mini-cal-popover" id="${idPrefix}-popover">
      <div class="mini-cal-header">
        <button type="button" class="mini-cal-nav" id="${idPrefix}-prev" title="Mês anterior">&#8249;</button>
        <span class="mini-cal-label">${MONTHS[viewM]} de ${viewY}</span>
        <button type="button" class="mini-cal-nav" id="${idPrefix}-next" title="Próximo mês">&#8250;</button>
      </div>
      <div class="mini-cal-grid">${dowRow}${dayCells}</div>
      <div class="mini-cal-footer"><button type="button" class="mini-cal-today-link" id="${idPrefix}-today">Ir para hoje</button></div>
    </div>
  `;
}

// Formata uma data ISO ("YYYY-MM-DD") como "DD/MM" (sem ano) para exibir no botão
// compacto da célula de Data. Sem valor, mostra um placeholder neutro.
function fmtDateShort(iso){
  if(!iso) return "--/--";
  const parts = iso.split("-");
  if(parts.length<3) return "--/--";
  return `${parts[2]}/${parts[1]}`;
}

// Célula de Data compacta usada nas linhas de Entradas/Análises (existentes e na
// linha de novo lançamento): um botão mostrando "DD/MM" que abre o mesmo
// mini-calendário do filtro do topo, mais um input escondido que carrega o valor
// real. O input escondido mantém o mesmo id/data-field de sempre, então toda a
// lógica existente de change-listener, ordenação e submissão continua funcionando
// sem alteração — só dispara um evento "change" nele quando um dia é escolhido.
function renderDateCellHtml(scope, idHint, fieldName, dateValue, inputId){
  const isOpen = !!(rowDatePicker && rowDatePicker.scope===scope && rowDatePicker.id===idHint);
  const idPrefix = `${scope}-rc-${idHint}`;
  const fullDate = dateValue ? dateValue.split("-").reverse().join("/") : "";
  return `
    <div class="date-cell-wrap">
      <input type="hidden" ${inputId?`id="${inputId}"`:""} data-field="${fieldName}" value="${dateValue||''}">
      <button type="button" class="date-cell-btn" data-date-scope="${scope}" data-date-id="${idHint}" title="${fullDate}">${fmtDateShort(dateValue)}</button>
      ${isOpen ? renderMiniCalendarHtml(idPrefix, rowDatePicker.viewY, rowDatePicker.viewM, dateValue) : ""}
    </div>
  `;
}

// Aplica a data escolhida no mini-calendário de uma linha: atualiza o input
// escondido correspondente e dispara "change" nele, deixando toda a lógica já
// existente (persistência, ordenação, submissão de nova linha) rodar sem mudanças.
function pickRowDate(scope, iso, idHint){
  rowDatePicker = null;
  let hidden = null;
  if(scope==="entradas"){
    hidden = idHint==="new"
      ? document.getElementById("new-date")
      : document.querySelector(`#bets-tbody tr[data-id="${CSS.escape(idHint)}"] input[data-field="date"]`);
  } else {
    hidden = idHint==="new"
      ? document.getElementById("an-data")
      : document.querySelector(`#an-tbody tr[data-id="${CSS.escape(idHint)}"] input[data-field="date"]`);
  }
  if(hidden){
    hidden.value = iso;
    hidden.dispatchEvent(new Event("change", {bubbles:true}));
  }
  // Garante o fechamento visual do popover e a atualização do rótulo do botão
  // mesmo quando o listener acima não re-renderiza (ex.: linha de novo lançamento
  // com campos obrigatórios ainda vazios) — vale a re-renderização redundante.
  if(scope==="entradas") renderEntradas(); else renderAnalises();
}

// Liga os cliques dos botões de data compactos de uma tabela (Entradas ou
// Análises) e, se o popover dessa tabela estiver aberto, os controles internos
// dele (navegação de mês, "ir para hoje" e clique num dia). Chamado no fim de
// renderEntradas()/renderAnalises(), seguindo o mesmo padrão de "religar tudo a
// cada render" já usado no resto do app.
function wireRowDatePickers(scope, rerenderFn){
  const tableEl = document.getElementById(scope==="entradas" ? "entradas-table" : "analises-table");
  const wrapEl = tableEl ? tableEl.closest(".table-wrap") : null;
  if(wrapEl) wrapEl.classList.toggle("rowcal-open", !!(rowDatePicker && rowDatePicker.scope===scope));

  document.querySelectorAll(`.date-cell-btn[data-date-scope="${scope}"]`).forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const idHint = btn.dataset.dateId;
      if(rowDatePicker && rowDatePicker.scope===scope && rowDatePicker.id===idHint){
        rowDatePicker = null;
      } else {
        const wrap = btn.closest(".date-cell-wrap");
        const hidden = wrap ? wrap.querySelector('input[type="hidden"]') : null;
        const base = (hidden && hidden.value) || todayIso();
        const [y,m] = base.split("-").map(Number);
        rowDatePicker = { scope, id: idHint, viewY: y, viewM: m-1 };
      }
      rerenderFn();
    });
  });

  if(!(rowDatePicker && rowDatePicker.scope===scope)) return;
  const idPrefix = `${scope}-rc-${rowDatePicker.id}`;
  const popover = document.getElementById(`${idPrefix}-popover`);
  if(!popover) return;
  popover.addEventListener("click", e=> e.stopPropagation());
  const prevBtn = document.getElementById(`${idPrefix}-prev`);
  const nextBtn = document.getElementById(`${idPrefix}-next`);
  const todayBtn = document.getElementById(`${idPrefix}-today`);
  if(prevBtn) prevBtn.addEventListener("click", ()=>{
    rowDatePicker.viewM--;
    if(rowDatePicker.viewM<0){ rowDatePicker.viewM=11; rowDatePicker.viewY--; }
    rerenderFn();
  });
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    rowDatePicker.viewM++;
    if(rowDatePicker.viewM>11){ rowDatePicker.viewM=0; rowDatePicker.viewY++; }
    rerenderFn();
  });
  if(todayBtn) todayBtn.addEventListener("click", ()=> pickRowDate(scope, todayIso(), rowDatePicker.id));
  document.querySelectorAll(`#${idPrefix}-popover .mini-cal-day[data-iso]`).forEach(dayBtn=>{
    dayBtn.addEventListener("click", ()=> pickRowDate(scope, dayBtn.dataset.iso, rowDatePicker.id));
  });
}

// Opções de "Superioridade no jogo": o VALOR salvo continua fixo ("Mandante HT" etc,

// Comparador de data (string ISO "YYYY-MM-DD"): mais recente primeiro.
function dateDescCompare(a,b){
  const da = a.date || "";
  const db = b.date || "";
  if(da === db) return 0;
  return da > db ? -1 : 1;
}

// Comparador de data+hora (Análises tem campo "hora"; sem hora definida entra
// como 00:00, ficando por último dentro do próprio dia). Mais recente primeiro
// — ou seja, dentro do mesmo dia, o horário mais tarde fica no topo.
function dateTimeDescCompare(a,b){
  const ka = (a.date || "") + "T" + (a.hora || "00:00");
  const kb = (b.date || "") + "T" + (b.hora || "00:00");
  if(ka === kb) return 0;
  return ka > kb ? -1 : 1;
}

// Reordena o próprio array (em memória) por data (e hora, quando existir), mais recente primeiro.
// Chamado sempre que um lançamento/análise é criado ou tem a data/hora alterada,
// para que a posição correta já fique gravada no estado (e sobreviva a undo,
// sincronização remota etc.), e não dependa só da ordenação feita na hora de renderizar.
function sortByDateDescInPlace(arr, useHora){
  arr.sort(useHora ? dateTimeDescCompare : dateDescCompare);
  return arr;
}

// Ordena por data para exibição: sem filtro ativo -> mais recente no topo, mais antigo no final
// (dentro do mesmo dia, usa a hora quando existir; sem hora, mantém quem entrou por último no
// topo, via sort estável). Com filtro de um dia específico ativo -> inverte, mais antigo no
// topo, mais recente no final.
function sortRowsByDate(list, filterActive, useHora){
  const sorted = [...list].sort(useHora ? dateTimeDescCompare : dateDescCompare);
  return filterActive ? sorted.reverse() : sorted;
}

function applyTeamSearch(list, term, mandante, visitante){
  const q = (term||"").trim().toLowerCase();
  if(!q) return list;
  return list.filter(item=>{
    const home = (item.home||"").toLowerCase();
    const away = (item.away||"").toLowerCase();
    if(mandante && !visitante) return home.includes(q);
    if(visitante && !mandante) return away.includes(q);
    return home.includes(q) || away.includes(q);
  });
}

function attachRestrictedTeamInput(inputEl, getList){
  if(!inputEl || inputEl.dataset.restrictedBound) return;
  inputEl.dataset.restrictedBound = "1";
  let lastValid = inputEl.value || "";
  inputEl.addEventListener("input", ()=>{
    const val = inputEl.value;
    if(val===""){ lastValid=""; return; }
    const lower = val.toLowerCase();
    const list = getList();
    const ok = list.some(item=>item.toLowerCase().startsWith(lower));
    if(ok){
      lastValid = val;
    } else {
      const pos = Math.max(0, inputEl.selectionStart - 1);
      inputEl.value = lastValid;
      inputEl.setSelectionRange(pos,pos);
    }
  });
}

function ensureListed(list, value){
  if(!value) return true;
  const v = value.trim();
  if(!v) return true;
  const exists = list.some(x=>x.toLowerCase()===v.toLowerCase());
  if(exists) return false;
  list.push(v); list.sort((a,b)=>a.localeCompare(b,'pt-BR'));
  return true;
}

function statBlock(label, value, cls){
  return `<div class="stat-block"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div></div>`;
}

function renderCalendar(){
  document.getElementById("v-brl").classList.toggle("active", calView==="brl");
  document.getElementById("v-pct").classList.toggle("active", calView==="pct");
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById("cal-title").textContent = `${MONTHS[m]} de ${y}`;

  const ms = monthStats(y,m);
  const summaryEl = document.getElementById("cal-month-summary");
  if(summaryEl){
    summaryEl.innerHTML = `
      <div class="stat-label">Resultado do mês</div>
      <div class="stat-value ${ms.profit>0?'pos':(ms.profit<0?'neg':'')}">${fmtBRL(ms.profit)}</div>
      <div class="cal-month-summary-pct ${ms.profit>0?'pos':(ms.profit<0?'neg':'')}">${fmtPct(ms.pct)}</div>
    `;
  }

  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  let html = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  const today = todayIso();
  cells.forEach(d=>{
    if(d===null){ html += `<div class="cal-cell empty"></div>`; return; }
    const iso = isoDate(y,m,d);
    const profit = dailyProfit(iso);
    const hasData = state.bets.some(b=>b.date===iso);
    let cls = "cal-cell";
    if(hasData) cls += profit>0 ? " pos" : (profit<0 ? " neg" : " has-data");
    if(iso===today) cls += " today-outline";
    let valueHtml = "";
    if(hasData){
      const banca = bankrollBeforeDate(iso);
      const val = calView==="brl" ? (isMobileViewport() ? fmtBRLCalMobile(profit) : fmtBRL(profit)) : fmtPct(banca>0 ? profit/banca : 0);
      valueHtml = `<div class="cal-value">${val}</div>`;
    }
    html += `<div class="${cls}" data-iso="${hasData?iso:''}"><div class="cal-daynum">${d}</div>${valueHtml}</div>`;
  });
  const grid = document.getElementById("cal-grid");
  grid.className = "cal-grid";
  grid.innerHTML = html;
  grid.querySelectorAll(".cal-cell[data-iso]").forEach(cell=>{
    const iso = cell.getAttribute("data-iso");
    if(!iso) return;
    cell.addEventListener("click", ()=>{
      entradasFilterDate = iso;
      currentTab = "entradas";
      renderTabs();
    });
  });
}

/* ================= GRÁFICO MENSAL ================= */
function renderMonthlyChart(){
  const box = document.getElementById("monthly-chart");
  if(!box) return;
  const data = monthlyPerformance();
  if(data.length===0){
    box.innerHTML = `<div class="empty-state">Sem lançamentos suficientes para montar o gráfico ainda.</div>`;
    return;
  }
  // largura real do container: usar como unidades do viewBox mantém o texto/traços
  // em tamanho legível em qualquer tela (em vez de um viewBox fixo de 900, que no
  // mobile é escalado para baixo e encolhe tudo, inclusive as fontes, junto com as barras).
  const containerW = box.clientWidth || box.parentElement?.clientWidth || window.innerWidth - 80;
  const W = Math.max(300, Math.min(900, Math.round(containerW)));
  const isCompact = W < 560;
  const shown = data.slice(isCompact ? -6 : -12); // menos meses no mobile = barras mais largas e legíveis
  const H = isCompact ? 240 : 190;
  const padL = isCompact ? 34 : 44, padR = isCompact ? 8 : 16, padT = 14, padB = isCompact ? 30 : 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxAbs = Math.max(1, ...shown.map(d=>Math.abs(d.profit)));
  const zeroY = padT + innerH/2;
  const scaleY = (innerH/2 - 6) / maxAbs;
  const n = shown.length;
  const bandW = innerW / n;
  const barW = Math.min(22, bandW*0.32);

  let bars = "", labels = "", gridLines = "";
  gridLines += `<line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="var(--border)" stroke-width="1"/>`;

  shown.forEach((d,i)=>{
    const cx = padL + bandW*i + bandW/2;
    const h = Math.abs(d.profit) * scaleY;
    const y = d.profit>=0 ? zeroY - h : zeroY;
    const color = d.profit>0 ? "var(--pos)" : (d.profit<0 ? "var(--red)" : "var(--text-faint)");
    const labelY = d.profit>=0 ? (zeroY - h - 8) : (zeroY + h + 16);
    bars += `<rect x="${(cx-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="4" fill="${color}" opacity="0.9"><title>${escapeHtml(d.label)}: ${fmtBRL(d.profit)}</title></rect>`;
    bars += `<text x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" class="chart-value-label" fill="${color}">${fmtBRL(d.profit)}</text>`;
    labels += `<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" class="chart-axis-label">${d.label}</text>`;
  });

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="monthly-chart-svg" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    ${bars}
    ${labels}
  </svg>`;
}
let _chartResizeTimer = null;
window.addEventListener("resize", ()=>{

  _chartResizeTimer = setTimeout(()=>{
    if(currentTab==="dashboard") renderMonthlyChart();

function rankingTable(list, cls){

      const field = e.target.dataset.field;
      if(field==="champ" || field==="home" || field==="away"){
        const list = field==="champ" ? state.championships : state.clubs;
        const raw = e.target.value.trim();
        if(raw===""){
          bet[field] = "";

          const matched = resolveRegistered(list, raw);
          if(matched===null){
            const label = field==="champ" ? "campeonato" : "clube";

      }

    };

    const data = readNewBet();
    if(!data.home || !data.away || data.stake<=0){

    const v = validateTeamFields(data);

    submittingBet = true;
    state.bets.unshift({ id: uid(), ...data, oddManual:"" });
    sortByDateDescInPlace(state.bets);
    persist();
    renderEntradas();
  }

    inp.addEventListener("change", ()=> submitNewBet(false));
